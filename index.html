        const getLogoBase64ForPDF = () => {

                img.onerror = () => resolve(null);

        // ============================================================================

        const OPCIONES_EXPERIENCIA = [

            "Menos de 6 meses en ventas / caja",
            "6 meses a 1 año en microfinanzas / banca",
            "1 a 3 años en microfinanzas / caja",
            "Más de 3 años (Con experiencia y cartera)"
        ];

        const OPCIONES_REFERENCIAS = [
            "Pendiente llamar a ex-jefes",
            "Referencias Confirmadas Positivas",
            "Referencias Regulares / Con Observación",
            "Referencias Negativas / No Recomendable"
        ];

        const OPCIONES_DOMICILIO = [
            "Pendiente de verificación",
            "Domicilio Verificado (Casa Propia / Familiar)",
            "Domicilio Verificado (Alquilado)",
            "Zona Alejada / Difícil Acceso",

        ];

        const INITIAL_FOLDERS = [
            { id: "f-general", nombre: "General", url: CREDIBAN_VAULT.getMasterDriveUrl() },
            { id: "f-asesores", nombre: "Asesores", url: CREDIBAN_VAULT.getMasterDriveUrl() },

            { id: "f-contratos", nombre: CARPETA_CONTRATOS_NOMBRE, url: CREDIBAN_VAULT.getMasterDriveUrl() },
            { id: "f-convocatoria", nombre: "Convocatoria 2026", url: CREDIBAN_VAULT.getMasterDriveUrl() }
        ];

        const FALLBACK_USERS = [
            { usuario: "Ana Torres", cargo: "Gerente", sede: "TODAS", clave: "gerente2026", estado: "HABILITADO" },
            { usuario: "Gerente General", cargo: "Gerente", sede: "TODAS", clave: "123", estado: "HABILITADO" },
            { usuario: "Gerente Huacho", cargo: "Gerente", sede: "HUACHO", clave: "123", estado: "HABILITADO" },
            { usuario: "Gerente Huaraz", cargo: "Gerente", sede: "HUARAZ", clave: "123", estado: "HABILITADO" },
            { usuario: "Gerente Huanuco", cargo: "Gerente", sede: "HUANUCO", clave: "123", estado: "HABILITADO" }
        ];

        // ============================================================================
        // 4. UTILIDADES DE FECHAS, ALARMAS DE CALENDARIO Y GENERADOR DE CONTRATO WORD
        // ============================================================================
        const addMonthsToDateString = (yyyyMmDd, monthsToAdd) => {
            if (!yyyyMmDd || !monthsToAdd || Number(monthsToAdd) <= 0) return "";
            const parts = yyyyMmDd.split("-");
            if (parts.length !== 3) return "";
            const dt = new Date(Number(parts[0]), Number(parts[1]) - 1 + Number(monthsToAdd), Number(parts[2]));
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const addDaysToDateString = (yyyyMmDd, daysToAdd) => {
            if (!yyyyMmDd) return "";
            const parts = yyyyMmDd.split("-");
            if (parts.length !== 3) return "";
            const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]) + Number(daysToAdd));
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const formatDateDisplay = (yyyyMmDd) => {
            if (!yyyyMmDd) return "-";
            if (yyyyMmDd.includes("/")) return yyyyMmDd;
            const parts = yyyyMmDd.split("-");
            if (parts.length !== 3) return yyyyMmDd;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        };

        const calculateDaysRemaining = (fechaFinYyyyMmDd, plazoLabel = "") => {
            if (String(plazoLabel).toLowerCase().includes("indeterminado")) return 9999;
            if (!fechaFinYyyyMmDd) return null;
            const parts = fechaFinYyyyMmDd.split("-");
            if (parts.length !== 3) return null;
            const end = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 23, 59, 59);
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
            const diffTime = end.getTime() - todayStart.getTime();
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

        const getContractStatusInfo = (contratoObj) => {
            if (!contratoObj || !contratoObj.activo) {
                return { code: 'SIN_CONTRATO', label: 'Sin Contrato Activo', badgeCls: 'bg-slate-100 text-slate-600 border-slate-300', days: null };
            }
            if (String(contratoObj.plazoLabel || '').toLowerCase().includes('indeterminado')) {
                return { code: 'VIGENTE', label: '🟢 Indeterminado (Vigente)', badgeCls: 'bg-emerald-100 text-emerald-900 border-emerald-400', days: 9999 };
            }
            const days = calculateDaysRemaining(contratoObj.fechaFin, contratoObj.plazoLabel);
            if (days === null) {
                return { code: 'VIGENTE', label: '⚪ Fecha fin pendiente', badgeCls: 'bg-slate-100 text-slate-700 border-slate-300', days: null };
            }
            if (days < 0) {
                return { code: 'VENCIDO', label: `🔴 VENCIDO (Hace ${Math.abs(days)} días)`, badgeCls: 'bg-red-100 text-red-900 border-red-400 animate-pulse', days };
            }
            if (days === 0) {
                return { code: 'URGENTE', label: `🚨 VENCE HOY MISMO`, badgeCls: 'bg-red-600 text-white border-red-700 animate-pulse', days: 0 };
            }
            if (days === 1) {
                return { code: 'URGENTE', label: `⏰ VENCE MAÑANA (1 día)`, badgeCls: 'bg-orange-500 text-white border-orange-600 animate-pulse', days: 1 };
            }
            if (days <= 15) {
                return { code: 'URGENTE', label: `🟠 RENOVAR YA (Faltan ${days} días)`, badgeCls: 'bg-orange-100 text-orange-900 border-orange-400', days };
            }
            if (days <= 30) {
                return { code: 'PROXIMO', label: `🟡 Próximo a Renovar (${days} días)`, badgeCls: 'bg-amber-100 text-amber-900 border-amber-400', days };
            }
            return { code: 'VIGENTE', label: `🟢 Vigente (${days} días restantes)`, badgeCls: 'bg-emerald-100 text-emerald-900 border-emerald-400', days };
        };

        // 1. Generar enlace directo a Google Calendar (Programado 1 día antes del vencimiento a las 9:00 AM)
        const buildGoogleCalendarReminderUrl = (person) => {
            const c = person.notasRubros?.ficha?.contrato || {};
            if (!c.fechaFin) return "#";
            const dayBefore = addDaysToDateString(c.fechaFin, -1);
            const cleanDate = dayBefore.replace(/-/g, "");
            // De 09:00 AM a 10:00 AM hora local del día anterior al vencimiento
            const datesParam = `${cleanDate}T090000/${cleanDate}T100000`;
            const title = `🚨 RENOVAR CONTRATO MAÑANA: ${person.nombre} (${person.puesto} - ${person.sede})`;
            const details = [
                `RECORDATORIO DE RENOVACIÓN DE CONTRATO - CREDIBAN PERÚ S.A.C.`,
                `------------------------------------------------------------`,
                `• Colaborador: ${person.nombre}`,
                `• DNI: ${person.dni} | Celular: ${person.celular || 'No reg.'}`,
                `• Cargo y Agencia: ${person.puesto} - Agencia ${person.sede}`,
                `• Modalidad Actual: ${c.tipoContrato || 'Plazo Fijo'}`,
                `• Sueldo Actual: S/ ${c.sueldo || '0'} ${c.movilidadMonto ? '(+ S/ ' + c.movilidadMonto + ' Movilidad)' : ''}`,
                `• Fecha de Inicio: ${formatDateDisplay(c.fechaInicio)}`,
                `• Fecha Exacta de Vencimiento: ${formatDateDisplay(c.fechaFin)} (MAÑANA)`,
                `• Observaciones: ${c.observacion || 'Evaluar desempeño y generar nuevo contrato.'}`
            ].join("\n");

            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${datesParam}&details=${encodeURIComponent(details)}&location=${encodeURIComponent('CREDIBAN PERU - Agencia ' + person.sede)}`;
        };

        // 2. Descargar archivo de Alarma .ICS universal (Celular Android/iPhone, Outlook, Calendario Windows/Mac)
        const downloadIcsCalendarAlarm = (person) => {
            const c = person.notasRubros?.ficha?.contrato || {};
            if (!c.fechaFin) {
                alert("Este contrato es indeterminado o no tiene fecha de finalización.");
                return;
            }
            const dayBefore = addDaysToDateString(c.fechaFin, -1);
            const cleanDayBefore = dayBefore.replace(/-/g, "");
            const cleanEndDay = c.fechaFin.replace(/-/g, "");

            const icsLines = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//CREDIBAN PERU SAC//Sistema RRHH Contratos//ES",
                "CALSCALE:GREGORIAN",
                "METHOD:PUBLISH",
                "BEGIN:VEVENT",
                `UID:crediban-contrato-${person.id}-${cleanEndDay}@crediban.pe`,
                `DTSTAMP:${cleanDayBefore}T090000`,
                `DTSTART:${cleanDayBefore}T090000`,
                `DTEND:${cleanDayBefore}T100000`,
                `SUMMARY:🚨 RENOVAR CONTRATO MAÑANA: ${person.nombre} (${person.sede})`,
                `DESCRIPTION:El contrato de ${person.nombre} (DNI: ${person.dni}) como ${person.puesto} en Agencia ${person.sede} vence mañana (${formatDateDisplay(c.fechaFin)}). Sueldo actual: S/ ${c.sueldo || '0'}. Plazo: ${c.plazoLabel}.`,
                `LOCATION:CREDIBAN PERU - Agencia ${person.sede}`,
                "STATUS:CONFIRMED",
                "BEGIN:VALARM",
                "TRIGGER:-PT15M",
                "ACTION:DISPLAY",
                "DESCRIPTION:Recordatorio CREDIBAN: Renovar contrato mañana",
                "END:VALARM",
                "BEGIN:VALARM",
                "TRIGGER:-P1D",
                "ACTION:DISPLAY",
                "DESCRIPTION:Alerta Anticipada CREDIBAN: Renovación próxima",
                "END:VALARM",
                "END:VEVENT",
                "END:VCALENDAR"
            ];

            const blob = new Blob([icsLines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Alarma_Renovacion_${person.nombre.replace(/\s+/g, '_')}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        // 3. Generador de Documento de Contrato / Renovación en formato Word (.doc) listo para editar e imprimir
        const generateContractWordDocument = (contractData) => {
            const {
                nombre, dni, celular, residencia, puesto, sede,
                tipoContrato, sueldo, movilidadMonto, plazoLabel,
                fechaFirma, fechaInicio, fechaFin, observacion
            } = contractData;

            const cargoFormal = puesto === 'Caja' ? 'GESTOR(A) DE CAJA Y OPERACIONES' : 'ASESOR(A) DE CRÉDITOS Y COBRANZAS';
            const htmlDoc = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset="utf-8">
                    <title>Contrato ${nombre}</title>
                    <style>
                        @page { size: A4; margin: 2.5cm 2.5cm 2.5cm 2.5cm; }
                        body { font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.55; color: #111; text-align: justify; }
                        h1 { font-size: 13pt; text-align: center; font-weight: bold; text-decoration: underline; margin-bottom: 18pt; }
                        .brand { color: #59B447; font-family: Georgia, serif; font-size: 18pt; font-weight: bold; text-align: center; margin-bottom: 2pt; }
                        .subbrand { color: #59B447; font-size: 8pt; text-align: center; font-weight: bold; letter-spacing: 1px; margin-bottom: 16pt; }
                        .clause-title { font-weight: bold; margin-top: 12pt; margin-bottom: 4pt; }
                        .sig-table { width: 100%; margin-top: 65pt; border-collapse: collapse; }
                        .sig-cell { width: 50%; text-align: center; vertical-align: top; padding: 10pt; }
                    </style>
                </head>
                <body>
                    <div class="brand">CREDIBAN PERÚ S.A.C.</div>
                    <div class="subbrand">RUC: 20613997360 • AGENCIA ${sede}</div>
                    <h1>${String(tipoContrato || 'CONTRATO DE TRABAJO SUJETO A MODALIDAD').toUpperCase()}</h1>

                    <p>Conste por el presente documento el <b>${tipoContrato}</b> que celebran, de una parte <b>CREDIBAN PERÚ S.A.C.</b>, con RUC N° <b>20613997360</b>, a quien en adelante se le denominará <b>EL EMPLEADOR</b>; y de la otra parte Don(ña) <b>${nombre}</b>, identificado(a) con DNI N° <b>${dni}</b>, con celular N° <b>${celular || 'S/N'}</b> y domicilio en <b>${residencia || 'Agencia ' + sede}</b>, a quien en adelante se le denominará <b>EL TRABAJADOR</b>, en los términos y condiciones siguientes:</p>

                    <div class="clause-title">PRIMERO: OBJETO Y CARGO</div>
                    <p>Por el presente documento, <b>EL EMPLEADOR</b> contrata/renueva los servicios personales de <b>EL TRABAJADOR</b> para desempeñar el cargo de <b>${cargoFormal}</b> en la <b>AGENCIA ${sede}</b>, comprometiéndose a cumplir con eficiencia, honradez y responsabilidad las funciones propias de su puesto.</p>

        // ============================================================================
        // 5. MOTOR UNIVERSAL DE EXTRACCIÓN DE TEXTO (PDF + WORD .DOCX / .DOC)
        // ============================================================================
        async function extractRawTextFromAnyFile(file) {
            if (!file) return { fullText: "", topLines: [] };
            const fileName = (file.name || "").toLowerCase();
            let fullText = "";
            let topLines = [];

            // A) SI ES ARCHIVO WORD (.DOCX o .DOC)
            if (fileName.endsWith(".docx") || fileName.endsWith(".doc") || file.type.includes("word")) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    if (window.mammoth) {
                        const result = await window.mammoth.extractRawText({ arrayBuffer });
                        if (result && result.value) {
                            fullText = result.value;
                        }
                    }
                    // Respaldo para archivos .doc antiguos o RTF si mammoth devuelve vacío
                    if (!fullText || fullText.trim().length < 15) {
                        const decoder = new TextDecoder("iso-8859-1");
                        const rawStr = decoder.decode(arrayBuffer);
                        const readableBlocks = rawStr.match(/[A-Za-záéíóúñÁÉÍÓÚÑ0-9\s.,:;\/\-()°ºS$]{6,}/g);
                        if (readableBlocks) {
                            fullText = readableBlocks.join("\n");
                        }
                    }
                    topLines = fullText.split(/\r?\n/).map(l => l.trim()).filter(Boolean).slice(0, 22);
                } catch (err) {
                    console.warn("Aviso leyendo archivo Word:", err);
                }
                return { fullText, topLines };
            }

            // B) SI ES ARCHIVO PDF
            if ((file.type === "application/pdf" || fileName.endsWith(".pdf")) && window.pdfjsLib) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    const maxPages = Math.min(pdf.numPages, 4);

                    for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();

                        const lineBuckets = {};
                        textContent.items.forEach(item => {
                            const str = (item.str || "").trim();
                            if (!str) return;
                            const y = Math.round(item.transform[5] / 4) * 4;
                            if (!lineBuckets[y]) lineBuckets[y] = [];
                            lineBuckets[y].push({ x: item.transform[4], text: str });
                        });

                        const sortedYs = Object.keys(lineBuckets).map(Number).sort((a, b) => b - a);
                        const pageLines = sortedYs.map(y => {
                            const sortedItems = lineBuckets[y].sort((a, b) => a.x - b.x);
                            return sortedItems.map(i => i.text).join(" ").replace(/\s+/g, " ").trim();
                        }).filter(Boolean);

                        if (pageNum === 1) topLines = pageLines.slice(0, 20);
                        fullText += pageLines.join("\n") + "\n";
                    }
                } catch (err) {
                    console.warn("Aviso leyendo PDF:", err);
                }
            }

            return { fullText, topLines };
        }

        // Convertidor de fechas en texto español ("05 de noviembre de 2026" o "05/11/2026") a YYYY-MM-DD
        function parseSpanishDateToIso(rawDateStr) {
            if (!rawDateStr) return "";
            const s = String(rawDateStr).trim().toLowerCase();

            // Formato DD/MM/YYYY o DD-MM-YYYY
            const slashMatch = s.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](20\d{2})\b/);
            if (slashMatch) {
                const dd = String(slashMatch[1]).padStart(2, '0');
                const mm = String(slashMatch[2]).padStart(2, '0');
                const yyyy = slashMatch[3];
                return `${yyyy}-${mm}-${dd}`;
            }

            // Formato YYYY-MM-DD
            const isoMatch = s.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
            if (isoMatch) return isoMatch[0];

            // Formato "15 de noviembre de 2026" o "15 de noviembre del 2026"
            const mesesMap = {
                enero: '01', febrero: '02', marzo: '03', abril: '04', mayo: '05', junio: '06',
                julio: '07', agosto: '08', septiembre: '09', setiembre: '09', octubre: '10', noviembre: '11', diciembre: '12'
            };
            const textMatch = s.match(/\b(\d{1,2})\s+de\s+([a-záéíóú]+)\s+(?:de|del)\s+(20\d{2})\b/i);
            if (textMatch) {
                const dd = String(textMatch[1]).padStart(2, '0');
                const mesNombre = textMatch[2].toLowerCase();
                const mm = mesesMap[mesNombre];
                const yyyy = textMatch[3];
                if (mm) return `${yyyy}-${mm}-${dd}`;
            }
            return "";
        }

        // ============================================================================
        // 6. ANALIZADOR INTELIGENTE DE CVs Y DE CONTRATOS (PDF Y WORD)
        // ============================================================================
        async function extractCandidateOrContractData(file, agenciasActivas = DEFAULT_AGENCIAS) {
            const { fullText, topLines } = await extractRawTextFromAnyFile(file);

            const cleanFileName = (file ? file.name : "")
                .replace(/\.(pdf|docx|doc|jpg|jpeg|png)$/i, "")
                .replace(/^(cv|curriculum|vitae|hoja_de_vida|postulante|contrato|adenda|renovacion)[_\-\s]*/i, "")
                .replace(/[_\-]+/g, " ")
                .trim();

            // 1. EXTRAER DNI (Ignorando partes del RUC 20613997360)
            let dni = "";
            const textWithoutRuc = fullText.replace(/20613997360/g, "");
            const dniExplicit = textWithoutRuc.match(/(?:D\.?N\.?I\.?|DOCUMENTO\s+DE\s+IDENTIDAD|IDENTIFICAD[OA]\s+CON\s+DNI)\s*(?:N[°ºo.]?)?\s*[:#\-]?\s*([014678]\d{7})\b/i);
            if (dniExplicit) {
                dni = dniExplicit[1];
            } else {
                const all8Digits = textWithoutRuc.match(/\b([014678]\d{7})\b/g);
                if (all8Digits && all8Digits.length > 0) dni = all8Digits[0];
                else {
                    const fileDni = cleanFileName.match(/\b([014678]\d{7})\b/);
                    if (fileDni) dni = fileDni[1];
                }
            }

            // 2. EXTRAER CELULAR (9 dígitos empezando en 9)
            let celular = "";
            const phoneMatches = textWithoutRuc.match(/(?:\+?51[\s\-]?)?(9\d{2}[\s\-]?\d{3}[\s\-]?\d{3}|9\d{8})\b/g);
            if (phoneMatches && phoneMatches.length > 0) {
                for (let rawPhone of phoneMatches) {
                    const digits = rawPhone.replace(/\D/g, "");
                    const nineDigits = digits.length === 11 && digits.startsWith("51") ? digits.slice(2) : digits;
                    if (nineDigits.length === 9 && nineDigits.startsWith("9") && nineDigits !== dni) {
                        celular = nineDigits;
                        break;
                    }
                }
            }

            // 3. EXTRAER NOMBRE DEL POSTULANTE O TRABAJADOR (En CVs y en Contratos)
            let nombre = "";
            // Patrón de contrato ("de la otra parte Don(ña) JUAN PEREZ, identificado con DNI...")
            const contractWorkerMatch = fullText.match(/(?:de\s+la\s+otra\s+parte\s+(?:Don\(ña\)|Don|Doña|el\s+Sr\.?|la\s+Sra\.?|Sr\(a\)\.?)\s*|EL\s+TRABAJADOR\s*[:\-]\s*)([A-ZÁÉÍÓÚÑ][A-Za-záéíóúñÁÉÍÓÚÑ\s]{5,50}?)(?=\s*,\s*identificad|\s+con\s+DNI|\s+identificad)/i);
            const cvNameExplicit = fullText.match(/(?:NOMBRES?\s+Y\s+APELLIDOS?|APELLIDOS?\s+Y\s+NOMBRES?|NOMBRE\s+COMPLETO|POSTULANTE|TRABAJADOR|COLABORADOR)\s*[:\-]\s*([A-ZÁÉÍÓÚÑ][A-Za-záéíóúñÁÉÍÓÚÑ\s,]{5,55})/i);

            if (contractWorkerMatch) {
                nombre = contractWorkerMatch[1].replace(/\s+/g, " ").trim().toUpperCase();
            } else if (cvNameExplicit) {
                nombre = cvNameExplicit[1].replace(/,/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
            } else {
                const bannedWords = /^(CURRICULUM|CURRÍCULUM|VITAE|HOJA DE VIDA|CONTRATO|ADENDA|CREDIBAN|RESUMEN|PERFIL|CONTACTO|DATOS PERSONALES|EXPERIENCIA|EDUCACIÓN|EDUCACION|FORMACIÓN|FORMACION|HABILIDADES|REFERENCIAS|OBJETIVO|SOBRE MI|SOBRE MÍ|ASESOR|CAJERO|CAJA|HUACHO|HUARAZ|ICA|HUANUCO|HUÁNUCO|LIMA|PERÚ|PERU|DIRECCIÓN|DIRECCION|TELÉFONO|TELEFONO|CELULAR|CORREO|EMAIL|PRIMERO|SEGUNDO|CLÁUSULA)/i;
                for (let line of topLines) {
                    const cleanLine = line.replace(/[^A-Za-záéíóúñÁÉÍÓÚÑ\s]/g, " ").replace(/\s+/g, " ").trim();
                    const words = cleanLine.split(" ").filter(w => w.length >= 2);
                    if (
                        words.length >= 2 &&
                        words.length <= 6 &&
                        cleanLine.length >= 7 &&
                        cleanLine.length <= 52 &&
                        !bannedWords.test(cleanLine) &&
                        !/\d/.test(line) &&
                        !line.includes("@")
                    ) {
                        nombre = cleanLine.toUpperCase();
                        break;
                    }
                }
            }
            if (!nombre && cleanFileName) {
                const fromFile = cleanFileName.replace(/\d+/g, "").replace(/\s+/g, " ").trim();
                if (fromFile.length >= 4) nombre = fromFile.toUpperCase();
            }

            // 4. EXTRAER LUGAR DE RESIDENCIA / DOMICILIO Y AGENCIA SUGERIDA
            let residencia = "";
            const domContract = fullText.match(/domicilio\s+(?:real\s+)?en\s+([^,\n\r]{5,70})/i);
            const dirExplicit = fullText.match(/(?:DIRECCI[ÓO]N|DOMICILIO|LUGAR\s+DE\s+RESIDENCIA|RESIDENCIA|UBICACI[ÓO]N|DISTRITO)\s*[:\-]\s*([^\n\r]{4,75})/i);
            if (domContract) {
                residencia = domContract[1].trim();
            } else if (dirExplicit) {
                residencia = dirExplicit[1].trim();
            } else {
                const streetMatch = fullText.match(/\b((?:Av\.|Avenida|Jr\.|Jirón|Calle|Ca\.|Urb\.|Urbanización|Psje\.|Pasaje|Mz\.|Asoc\.|AA\.HH\.)\s+[^\n\r]{5,60})/i);
                if (streetMatch) residencia = streetMatch[1].trim();
            }

            const ciudadesPeru = [
                { pattern: /\b(HUACHO|HUALMAY|SANTA\s+MAR[IÍ]A|V[EÉ]GUETA|SAY[AÁ]N|HUAURA|BARRANCA)\b/i, ciudad: "Huacho", sede: "HUACHO" },
                { pattern: /\b(HUARAZ|INDEPENDENCIA\s*-\s*HUARAZ|CARHUAZ|YUNGAY|CARAZ|ANCASH|ÁNCASH)\b/i, ciudad: "Huaraz", sede: "HUARAZ" },
                { pattern: /\b(ICA|PARCONA|LA\s+TINGUI[ÑN]A|SUBTANJALLA|CHINCHA|PISCO|NAZCA)\b/i, ciudad: "Ica", sede: "ICA" },
                { pattern: /\b(HU[AÁ]NUCO|AMARILIS|PILLCO\s+MARCA|TINGO\s+MAR[IÍ]A|AMBO)\b/i, ciudad: "Huánuco", sede: "HUANUCO" },
                { pattern: /\b(LIMA|SAN\s+JUAN|ATE|COMAS|LOS\s+OLIVOS|CALLAO|SMP|CHORRILLOS|MIRAFLORES|SURCO)\b/i, ciudad: "Lima", sede: "LIMA" }
            ];

            let sedeSugerida = "";
            for (let item of ciudadesPeru) {
                const m = fullText.match(item.pattern);
                if (m) {
                    sedeSugerida = item.sede;
                    if (!residencia) residencia = `${m[1].toUpperCase()} (${item.ciudad})`;
                    break;
                }
            }
            // También revisar si menciona alguna agencia personalizada creada por el Gerente
            if (!sedeSugerida && Array.isArray(agenciasActivas)) {
                for (let ag of agenciasActivas) {
                    if (fullText.toUpperCase().includes(ag.toUpperCase())) {
                        sedeSugerida = ag.toUpperCase();
                        break;
                    }
                }
            }

            // 5. EXTRAER PUESTO Y ESTUDIOS
            let puestoSugerido = "Asesor";
            if (/\b(CAJERO|CAJERA|VENTANILLA|GESTOR[A]?\s+DE\s+CAJA|CAJA\s+Y\s+OPERACIONES|CUADRE\s+DE\s+CAJA)\b/i.test(fullText)) {
                puestoSugerido = "Caja";
            }

            let estudiosSugeridos = "Por confirmar documentos";
            if (/\b(UNIVERSITARIO|UNIVERSIDAD|LICENCIAD[OA]|INGENIER[OA]|CONTADOR|ECONOMISTA)\b/i.test(fullText)) {
                estudiosSugeridos = /\b(TITULAD[OA]|BACHILLER|COLEGIAD[OA])\b/i.test(fullText)
                    ? "Universitario Confirmado (Titulado / Bachiller)"
                    : "Universitario En Curso / Egresado";
            } else if (/\b(INSTITUTO|T[EÉ]CNICO|T[EÉ]CNICA)\b/i.test(fullText)) {
                estudiosSugeridos = "Técnico Confirmado (Titulado / Egresado)";
            } else if (/\b(SECUNDARIA\s+COMPLETA)\b/i.test(fullText)) {
                estudiosSugeridos = "Secundaria Completa Confirmada";
            }

            // 6. EXTRAER DATOS ESPECÍFICOS DE CONTRATO (FECHA DE FIRMA / INICIO, PLAZO, FECHA DE FINALIZACIÓN Y SUELDO)
            let sueldoExtraido = "";
            const sueldoMatch = fullText.match(/(?:remuneraci[óo]n|sueldo|honorarios?|contraprestaci[óo]n|b[áa]sico)[^S\d]{1,45}(?:S\/\.?|Soles)?\s*(\d{1,2}[,\.]?\d{3}(?:\.\d{2})?|\d{3,4}(?:\.\d{2})?)/i);
            if (sueldoMatch) {
                sueldoExtraido = sueldoMatch[1].replace(/,/g, "").split(".")[0];
            } else {
                const anySoles = fullText.match(/S\/\.?\s*(\d{1,2}[,\.]?\d{3}|\d{3,4})(?:\.\d{2})?\b/i);
                if (anySoles) sueldoExtraido = anySoles[1].replace(/,/g, "");
            }

            // Detectar Plazo del Contrato (1 Mes, 2 Meses, 3 Meses, 6 Meses, 12 Meses, Indeterminado)
            let plazoLabelExtraido = "3 Meses";
            let plazoMesesNum = 3;
            if (/\b(indeterminado|indefinido)\b/i.test(fullText)) {
                plazoLabelExtraido = "Indeterminado";
                plazoMesesNum = 0;
            } else if (/\b(doce\s*\(?12\)?\s*meses|12\s*meses|un\s*\(?1\)?\s*a[ñn]o|1\s*a[ñn]o)\b/i.test(fullText)) {
                plazoLabelExtraido = "12 Meses (1 Año)";
                plazoMesesNum = 12;
            } else if (/\b(seis\s*\(?6\)?\s*meses|6\s*meses|06\s*meses)\b/i.test(fullText)) {
                plazoLabelExtraido = "6 Meses";
                plazoMesesNum = 6;
            } else if (/\b(tres\s*\(?3\)?\s*meses|3\s*meses|03\s*meses)\b/i.test(fullText)) {
                plazoLabelExtraido = "3 Meses";
                plazoMesesNum = 3;
            } else if (/\b(dos\s*\(?2\)?\s*meses|2\s*meses|02\s*meses)\b/i.test(fullText)) {
                plazoLabelExtraido = "2 Meses";
                plazoMesesNum = 2;
            } else if (/\b(un\s*\(?1\)?\s*mes|1\s*mes|01\s*mes)\b/i.test(fullText)) {
                plazoLabelExtraido = "1 Mes";
                plazoMesesNum = 1;
            }

            // Extraer Fechas del Contrato (Inicio, Finalización y Firma)
            const dateRegexGlobal = /\b(\d{1,2}\s+de\s+[a-záéíóú]+\s+(?:de|del)\s+20\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}|20\d{2}-\d{2}-\d{2})\b/gi;
            const foundDatesRaw = fullText.match(dateRegexGlobal) || [];
            const foundDatesIso = foundDatesRaw.map(parseSpanishDateToIso).filter(Boolean);

            let fechaInicioExtraida = "";
            let fechaFinExtraida = "";
            let fechaFirmaExtraida = "";

            const inicioExplicit = fullText.match(/(?:iniciando|inicia|a\s+partir\s+del?|desde\s+el|vigencia\s+el(?:\s+d[íi]a)?)\s+(\d{1,2}\s+de\s+[a-záéíóú]+\s+(?:de|del)\s+20\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}|20\d{2}-\d{2}-\d{2})/i);
            const finExplicit = fullText.match(/(?:concluyendo|concluye|vence|vencimiento|hasta\s+el|finaliza(?:ndo)?\s+el(?:\s+d[íi]a)?)\s+(\d{1,2}\s+de\s+[a-záéíóú]+\s+(?:de|del)\s+20\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}|20\d{2}-\d{2}-\d{2})/i);
            const firmaExplicit = fullText.match(/(?:con\s+fecha|suscriben[^.\n]{1,40}el|firmado[^.\n]{1,40}el|a\s+los)\s+(\d{1,2}\s+de\s+[a-záéíóú]+\s+(?:de|del)\s+20\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}|20\d{2}-\d{2}-\d{2})/i);

            if (inicioExplicit) fechaInicioExtraida = parseSpanishDateToIso(inicioExplicit[1]);
            if (finExplicit) fechaFinExtraida = parseSpanishDateToIso(finExplicit[1]);
            if (firmaExplicit) fechaFirmaExtraida = parseSpanishDateToIso(firmaExplicit[1]);

            if (!fechaInicioExtraida && foundDatesIso.length >= 1) {
                fechaInicioExtraida = foundDatesIso[0];
            }
            if (!fechaFinExtraida && foundDatesIso.length >= 2) {
                fechaFinExtraida = foundDatesIso[1];
            }
            if (!fechaFirmaExtraida) {
                fechaFirmaExtraida = foundDatesIso.length >= 3 ? foundDatesIso[foundDatesIso.length - 1] : (fechaInicioExtraida || new Date().toISOString().slice(0, 10));
            }
            if (fechaInicioExtraida && !fechaFinExtraida && plazoMesesNum > 0) {
                fechaFinExtraida = addMonthsToDateString(fechaInicioExtraida, plazoMesesNum);
            }

            return {
                nombre: nombre || "",
                dni: dni || "",
                celular: celular || "",
                residencia: residencia || "",
                sedeSugerida: sedeSugerida || "",
                puestoSugerido,
                estudiosSugeridos,
                sueldoExtraido: sueldoExtraido || "1300",
                plazoLabelExtraido,
                fechaFirmaExtraida: fechaFirmaExtraida || new Date().toISOString().slice(0, 10),
                fechaInicioExtraida: fechaInicioExtraida || new Date().toISOString().slice(0, 10),
                fechaFinExtraida: fechaFinExtraida || addMonthsToDateString(new Date().toISOString().slice(0, 10), plazoMesesNum || 3),
                textoExtraido: fullText.length > 15
            };
        }

        // ============================================================================
        // 7. PANTALLA DE LOGIN PRIVADA (SOLO USUARIO Y CONTRASEÑA + RECORDAR CLAVE)
        // ============================================================================
        function LoginScreen({ users, loadingProgress, isFetchingUsers, syncMessage, onLoginSuccess, onRetrySync }) {
            const [usernameInput, setUsernameInput] = React.useState(() => localStorage.getItem('crediban_saved_login_user') || '');
            const [passwordInput, setPasswordInput] = React.useState(() => localStorage.getItem('crediban_saved_login_pass') || '');
            const [showPass, setShowPass] = React.useState(false);
            const [rememberCreds, setRememberCreds] = React.useState(true);
            const [error, setError] = React.useState('');

            const normalizeStr = (str) => String(str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');

                const cleanInputUser = normalizeStr(usernameInput);
                const cleanInputPass = String(passwordInput || '').trim();

                if (!cleanInputUser || !cleanInputPass) {
                    setError('⚠️ Por favor ingresa tu Usuario y Contraseña.');
                    return;
                }

                const matchedUser = users.find(u =>
                    normalizeStr(u.usuario) === cleanInputUser &&
                    String(u.clave).trim() === cleanInputPass
                );

                if (!matchedUser) {
                    const userExists = users.find(u => normalizeStr(u.usuario) === cleanInputUser);
                    if (userExists && !String(userExists.cargo || '').toLowerCase().includes('gerente')) {
                        setError('⛔ ACCESO DENEGADO: Tus credenciales no cuentan con autorización de Gerencia para este sistema.');
                        return;
                    }
                    setError('🔒 Usuario o contraseña incorrectos. Verifica tus datos.');
                    return;
                }

                if (!String(matchedUser.cargo || '').toLowerCase().includes('gerente')) {
                    setError('⛔ ACCESO RESTRINGIDO: Este sistema de Gestión de Personal y Contratos es exclusivo para Gerencia.');
                    return;
                }

                if (rememberCreds) {
                    localStorage.setItem('crediban_saved_login_user', usernameInput.trim());
                    localStorage.setItem('crediban_saved_login_pass', cleanInputPass);
                } else {
                    localStorage.removeItem('crediban_saved_login_user');
                    localStorage.removeItem('crediban_saved_login_pass');
                }

                onLoginSuccess(matchedUser, rememberCreds);
            };

            return (
                <div className="min-h-screen login-bg flex flex-col justify-center items-center p-5">
                    <div className="mb-5 animate-fade-in">
                        <OfficialLogo darkBg={true} />
                    </div>

                    <div className="bg-white/10 backdrop-blur-xl w-full max-w-md rounded-3xl shadow-2xl p-7 border border-white/20 border-t-8 border-t-[#59B447] animate-fade-in">
                        <div className="text-center mb-5">
                            <div className="inline-flex items-center gap-1.5 bg-[#59B447]/20 border border-[#59B447]/50 text-emerald-300 text-[11px] font-extrabold px-3.5 py-1 rounded-full uppercase tracking-wider mb-2">
                                🔒 Bóveda Privada de Gerencia
                            </div>
                            <h2 className="text-xl font-black text-white tracking-wide uppercase">Acceso al Sistema</h2>
                            <p className="text-xs text-slate-300 font-medium mt-0.5">Gestión de Personal, Postulantes y Contratos • CREDIBAN PERÚ</p>
                        </div>

                        {/* Indicador de Conexión al Servidor de Usuarios */}
                        <div className="mb-5 bg-slate-900/60 p-2.5 rounded-2xl border border-slate-700/60">
                            <div className="flex justify-between items-center text-[11px] font-extrabold mb-1">
                                <span className="text-slate-300">
                                    {isFetchingUsers ? '🔄 Sincronizando con Servidor...' : `✅ ${syncMessage}`}
                                </span>
                                <div className="flex items-center gap-2">
                                    <span className="text-[#59B447]">{loadingProgress}%</span>
                                    <button type="button" onClick={onRetrySync} className="text-[10px] text-emerald-300 hover:underline" title="Recargar conexión al Servidor">↻</button>
                                </div>
                            </div>
                            <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div
                                    className="h-full bg-gradient-to-r from-[#59B447] to-emerald-400 transition-all duration-300"
                                    style={{ width: `${loadingProgress}%` }}
                                />
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-[11px] font-extrabold text-slate-300 uppercase block mb-1.5 ml-1">
                                    Usuario
                                </label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">👤</span>
                                    <input
                                        type="text"
                                        autoComplete="username"
                                        placeholder="Ingresa tu usuario autorizado"
                                        value={usernameInput}
                                        onChange={e => { setUsernameInput(e.target.value); setError(''); }}
                                        className="w-full bg-slate-900/80 border-2 border-slate-600/80 focus:border-[#59B447] text-white rounded-xl pl-10 pr-4 py-3 text-sm font-bold outline-none focus:ring-2 focus:ring-[#59B447]/30 transition-all"
                                        required
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="text-[11px] font-extrabold text-slate-300 uppercase block mb-1.5 ml-1">
                                    Contraseña
                                </label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">🔑</span>
                                    <input
                                        type={showPass ? "text" : "password"}
                                        autoComplete="current-password"
                                        placeholder="••••••••••••"
                                        value={passwordInput}
                                        onChange={e => { setPasswordInput(e.target.value); setError(''); }}
                                        className="w-full bg-slate-900/80 border-2 border-[#59B447]/60 focus:border-[#59B447] text-white rounded-xl pl-10 pr-12 py-3 text-sm font-mono tracking-widest outline-none focus:ring-2 focus:ring-[#59B447]/40 transition-all"
                                        required
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowPass(!showPass)}
                                        className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs font-bold text-slate-400 hover:text-white"
                                    >
                                        {showPass ? '🙈' : '👁️'}
                                    </button>
                                </div>
                            </div>

                            {error && (
                                <div className="bg-red-500/20 text-red-200 text-xs font-bold p-3.5 rounded-xl border border-red-400/40 text-center leading-relaxed">
                                    {error}
                                </div>
                            )}

                            <label className="flex items-center gap-2.5 cursor-pointer pt-1 ml-1">
                                <input
                                    type="checkbox"
                                    checked={rememberCreds}
                                    onChange={e => setRememberCreds(e.target.checked)}
                                    className="w-4 h-4 accent-[#59B447] rounded"
                                />
                                <span className="text-xs font-semibold text-slate-300">
                                    🔒 Recordar contraseña y mantener sesión iniciada
                                </span>
                            </label>

                            <button
                                type="submit"
                                className="w-full bg-gradient-to-r from-[#59B447] to-[#4a973a] hover:opacity-95 active:scale-[0.99] text-white font-black py-3.5 rounded-2xl shadow-lg shadow-green-950/60 transition-all text-sm uppercase tracking-wider mt-2"
                            >
                                🔓 Ingresar al Sistema
                            </button>
                        </form>
                    </div>
                </div>
            );
        }// ============================================================================
        // 8. APLICACIÓN PRINCIPAL: POSTULANTES, CONTRATOS, ALARMAS Y AGENCIAS EN NUBE
        // ============================================================================
        function App() {
            const usersServerUrl = CREDIBAN_VAULT.getUsersServer();
            const dataServerUrl = CREDIBAN_VAULT.getDataServer();

            // Navegación Principal: 'POSTULANTES' vs 'CONTRATOS'
            const [activeMainTab, setActiveMainTab] = React.useState('POSTULANTES');

            // Estados de Usuarios y Autenticación
            const [users, setUsers] = React.useState(FALLBACK_USERS);
            const [loadingProgress, setLoadingProgress] = React.useState(25);
            const [isFetchingUsers, setIsFetchingUsers] = React.useState(false);
            const [userSyncMsg, setUserSyncMsg] = React.useState('Servidor Conectado');
            const [dataSyncMsg, setDataSyncMsg] = React.useState('Sincronizando...');
            const [isSaving, setIsSaving] = React.useState(false);

            const [currentUser, setCurrentUser] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('crediban_gerente_rrhh_session_v5');
                    if (!saved) return null;
                    const parsed = JSON.parse(saved);
                    return String(parsed.cargo || '').toLowerCase().includes('gerente') ? parsed : null;
                } catch (e) { return null; }
            });

            // Lista de Agencias Sincronizada Multi-Dispositivo (con HUANUCO en lugar de HUAURA)
            const [agencias, setAgencias] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('crediban_agencias_cloud_v5');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed.map(a => a === 'HUAURA' ? 'HUANUCO' : a);
                        }
                    }
                } catch (e) {}
                return DEFAULT_AGENCIAS;
            });

            // Modal Gestor de Agencias (Sincronizado en Servidor para todos los dispositivos)
            const [isAgencyModalOpen, setIsAgencyModalOpen] = React.useState(false);
            const [newAgencyName, setNewAgencyName] = React.useState('');
            const [editingAgencyOld, setEditingAgencyOld] = React.useState(null);
            const [editingAgencyNew, setEditingAgencyNew] = React.useState('');
            const [isAgencySyncing, setIsAgencySyncing] = React.useState(false);

            // Carpetas de Google Drive
            const [folders, setFolders] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('crediban_drive_folders_v5');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch (e) {}
                return INITIAL_FOLDERS;
            });

            // Lista de IDs eliminados
            const [deletedIds, setDeletedIds] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('crediban_deleted_ids_v5');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            // Base Unificada de Candidatos y Personal con Contratos
            const [applicants, setApplicants] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('crediban_applicants_v5') || localStorage.getItem('crediban_applicants_v4');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed)) return parsed.filter(x => x.id !== CLOUD_CONFIG_ID);
                    }
                } catch (e) {}
                return [];
            });

            // Acordeón de Indicadores en Tarjetas
            const [expandedCardIds, setExpandedCardIds] = React.useState({});

            // Filtros Pestaña 1 (Postulantes)
            const [filterEstado, setFilterEstado] = React.useState('TODOS');
            const [filterPuesto, setFilterPuesto] = React.useState('TODOS');
            const [filterSede, setFilterSede] = React.useState('TODAS');
            const [filterCarpeta, setFilterCarpeta] = React.useState('TODAS');
            const [filterNota, setFilterNota] = React.useState('TODAS');
            const [filterDenuncias, setFilterDenuncias] = React.useState('TODOS');
            const [filterScore, setFilterScore] = React.useState('TODOS');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [sortBy, setSortBy] = React.useState('RECIENTES');

            // Filtros Pestaña 2 (Contratos y Renovaciones)
            const [filterContratoAlerta, setFilterContratoAlerta] = React.useState('TODOS');
            const [filterContratoSede, setFilterContratoSede] = React.useState('TODAS');
            const [filterContratoPuesto, setFilterContratoPuesto] = React.useState('TODOS');
            const [searchContrato, setSearchContrato] = React.useState('');

            // Modal Subida de CV (PDF o Word) -> Análisis Automático -> Ventana de Confirmación
            const [isUploadModalOpen, setIsUploadModalOpen] = React.useState(false);
            const [isAnalyzingDoc, setIsAnalyzingDoc] = React.useState(false);
            const [isConfirmationStep, setIsConfirmationStep] = React.useState(false);
            const [selectedFile, setSelectedFile] = React.useState(null);
            const [docExtractedOk, setDocExtractedOk] = React.useState(false);

            const [formNombre, setFormNombre] = React.useState('');
            const [formDni, setFormDni] = React.useState('');
            const [formCelular, setFormCelular] = React.useState('');
            const [formResidencia, setFormResidencia] = React.useState('');
            const [formPuesto, setFormPuesto] = React.useState('Asesor');
            const [formSede, setFormSede] = React.useState('HUACHO');
            const [formCarpeta, setFormCarpeta] = React.useState('General');
            const [formEstudiosInit, setFormEstudiosInit] = React.useState('Por confirmar documentos');
            const [formBiografiaIAInit, setFormBiografiaIAInit] = React.useState('');
            const [formComentarioInit, setFormComentarioInit] = React.useState('');
            const [showInlineNewFolder, setShowInlineNewFolder] = React.useState(false);
            const [inlineFolderName, setInlineFolderName] = React.useState('');

            // Modal de Resumen Detallado Ejecutivo
            const [detailApplicant, setDetailApplicant] = React.useState(null);
            const [replaceCvFile, setReplaceCvFile] = React.useState(null);
            const [newCommentText, setNewCommentText] = React.useState('');

            // Modal de Gestión de Contrato, Autollenado desde PDF/Word y Generador desde Contrato Base
            const [isContractModalOpen, setIsContractModalOpen] = React.useState(false);
            const [contractModalMode, setContractModalMode] = React.useState('NUEVO'); // 'NUEVO', 'EDITAR', 'RENOVAR_BASE'
            const [contractTargetPerson, setContractTargetPerson] = React.useState(null);
            const [contractPersonId, setContractPersonId] = React.useState('NUEVO');
            const [contractNombre, setContractNombre] = React.useState('');
            const [contractDni, setContractDni] = React.useState('');
            const [contractCelular, setContractCelular] = React.useState('');
            const [contractResidencia, setContractResidencia] = React.useState('');
            const [contractPuesto, setContractPuesto] = React.useState('Asesor');
            const [contractSede, setContractSede] = React.useState('HUACHO');
            const [contractTipo, setContractTipo] = React.useState('Plazo Fijo / Sujeto a Modalidad');
            const [contractSueldo, setContractSueldo] = React.useState('1300');
            const [contractMovilidadMonto, setContractMovilidadMonto] = React.useState('');
            const [contractPlazoLabel, setContractPlazoLabel] = React.useState('3 Meses');
            const [contractFechaFirma, setContractFechaFirma] = React.useState(() => new Date().toISOString().slice(0, 10));
            const [contractFechaInicio, setContractFechaInicio] = React.useState(() => new Date().toISOString().slice(0, 10));
            const [contractFechaFin, setContractFechaFin] = React.useState(() => addMonthsToDateString(new Date().toISOString().slice(0, 10), 3));
            const [contractObservacion, setContractObservacion] = React.useState('');
            const [contractDocFile, setContractDocFile] = React.useState(null);
            const [isAnalyzingContractDoc, setIsAnalyzingContractDoc] = React.useState(false);
            const [contractAutoFilledBanner, setContractAutoFilledBanner] = React.useState('');

            // Modal Gestor de Carpetas de Drive
            const [isFolderModalOpen, setIsFolderModalOpen] = React.useState(false);
            const [newFolderName, setNewFolderName] = React.useState('');
            const [editingFolderKey, setEditingFolderKey] = React.useState(null);
            const [editingFolderValue, setEditingFolderValue] = React.useState('');
            const [isFolderBusy, setIsFolderBusy] = React.useState(false);

            // Normalizador de Estructura (Migra automáticamente HUAURA -> HUANUCO)
            const normalizeApplicant = (raw) => {
                const rubrosRaw = (raw.notasRubros && typeof raw.notasRubros === 'object') ? raw.notasRubros : {};
                const fichaRaw = (rubrosRaw.ficha && typeof rubrosRaw.ficha === 'object') ? rubrosRaw.ficha : {};
                const contratoRaw = (fichaRaw.contrato && typeof fichaRaw.contrato === 'object') ? fichaRaw.contrato : {};

                let est = raw.estado || "En Evaluación";
                if (est === "En Revisión") est = "En Evaluación";
                if (est === "Entrevista") est = "Programado para Entrevista";
                if (est === "Descartado") est = "No Apto";

                let sedeNorm = String(raw.sede || "HUACHO").toUpperCase().trim();
                if (sedeNorm === "HUAURA") sedeNorm = "HUANUCO";

                return {
                    ...raw,
                    sede: sedeNorm,
                    estado: est,
                    carpetaNombre: raw.carpetaNombre || "General",
                    calificacion: Number(raw.calificacion) || 0,
                    eliminado: Boolean(rubrosRaw.eliminado || raw.eliminado),
                    notasRubros: {
                        exp: Number(rubrosRaw.exp) || 0,
                        act: Number(rubrosRaw.act) || 0,
                        tec: Number(rubrosRaw.tec) || 0,
                        eliminado: Boolean(rubrosRaw.eliminado || raw.eliminado),
                        ficha: {
                            residencia: fichaRaw.residencia || raw.residencia || "No especificada",
                            biografiaIA: fichaRaw.biografiaIA || "",
                            denuncias: fichaRaw.denuncias || "Pendiente de verificación",
                            detalleDenuncias: fichaRaw.detalleDenuncias || "",
                            scoreCrediticio: fichaRaw.scoreCrediticio || "Pendiente de consulta",
                            detalleScore: fichaRaw.detalleScore || "",
                            estudios: fichaRaw.estudios || "Por confirmar documentos",
                            detalleEstudios: fichaRaw.detalleEstudios || "",
                            hijos: fichaRaw.hijos || "0 (Sin hijos)",
                            edad: fichaRaw.edad || "",
                            estadoCivil: fichaRaw.estadoCivil || "No especificado",
                            movilidad: fichaRaw.movilidad || "No especificado",
                            expFinanciera: fichaRaw.expFinanciera || "Por validar en entrevista",
                            referencias: fichaRaw.referencias || "Pendiente llamar a ex-jefes",
                            verificacionDomicilio: fichaRaw.verificacionDomicilio || "Pendiente de verificación",
                            disponibilidad: fichaRaw.disponibilidad || "Inmediata",
                            pretensionSalarial: fichaRaw.pretensionSalarial || "",
                            nombreArchivoOriginal: fichaRaw.nombreArchivoOriginal || "",
                            contrato: {
                                activo: Boolean(contratoRaw.activo),
                                tipoContrato: contratoRaw.tipoContrato || "Plazo Fijo / Sujeto a Modalidad",
                                sueldo: contratoRaw.sueldo || "",
                                movilidadMonto: contratoRaw.movilidadMonto || "",
                                plazoLabel: contratoRaw.plazoLabel || "3 Meses",
                                fechaFirma: contratoRaw.fechaFirma || contratoRaw.fechaInicio || "",
                                fechaInicio: contratoRaw.fechaInicio || "",
                                fechaFin: contratoRaw.fechaFin || "",
                                observacion: contratoRaw.observacion || "",
                                nombreArchivoContrato: contratoRaw.nombreArchivoContrato || "",
                                urlContratoPreview: contratoRaw.urlContratoPreview || "",
                                urlContratoDownload: contratoRaw.urlContratoDownload || "",
                                driveContratoId: contratoRaw.driveContratoId || "",
                                actualizadoPor: contratoRaw.actualizadoPor || "",
                                fechaActualizacion: contratoRaw.fechaActualizacion || "",
                                historialContratos: Array.isArray(contratoRaw.historialContratos) ? contratoRaw.historialContratos : []
                            }
                        }
                    },
                    historial: Array.isArray(raw.historial) ? raw.historial : []
                };
            };

            // 1. Descargar Usuarios desde el Servidor Central de Usuarios
            const fetchUsersFromMaster = async () => {
                setIsFetchingUsers(true);
                setLoadingProgress(35);
                setUserSyncMsg('Validando Usuarios...');

                const parseUsersArray = (rawList) => {
                    if (!Array.isArray(rawList)) return [];
                    return rawList.map(item => {
                        const usuario = String(item.usuario || item.Usuario || item.nombre || item.Nombre || '').trim();
                        const cargo = String(item.cargo || item.Cargo || item.rol || item.Rol || 'Trabajador').trim();
                        let sede = String(item.sede || item.Sede || 'TODAS').trim().toUpperCase();
                        if (sede === 'HUAURA') sede = 'HUANUCO';
                        const clave = String(item.clave !== undefined ? item.clave : (item.Clave !== undefined ? item.Clave : '')).trim();
                        const estado = String(item.estado || item.Estado || 'HABILITADO').trim().toUpperCase();
                        return { usuario, cargo, sede, clave, estado };
                    }).filter(u => u.usuario && u.estado !== 'DESHABILITADO' && u.estado !== 'INACTIVO');
                };

                try {
                    const res = await fetch(usersServerUrl);
                    setLoadingProgress(75);
                    const data = await res.json();
                    const rawList = Array.isArray(data) ? data : (data.usuarios || data.data || []);
                    const normalized = parseUsersArray(rawList);
                    if (normalized.length > 0) {
                        setUsers(normalized);
                        setLoadingProgress(100);
                        setUserSyncMsg('Servidor de Usuarios Activo');
                        setIsFetchingUsers(false);
                        return;
                    }
                } catch (e) {}

                try {
                    const res2 = await fetch(dataServerUrl);
                    const data2 = await res2.json();
                    const normalized2 = parseUsersArray(data2.usuarios || []);
                    if (normalized2.length > 0) {
                        setUsers(normalized2);
                        setLoadingProgress(100);
                        setUserSyncMsg('Servidor de Usuarios Activo');
                        setIsFetchingUsers(false);
                        return;
                    }
                } catch (e2) {}

                setLoadingProgress(100);
                setUserSyncMsg('Servidor Listo');
                setIsFetchingUsers(false);
            };

            // 2. Descargar Postulantes, Contratos, Carpetas y Agencias Globales desde el Servidor
            const fetchApplicantsAndFolders = async () => {
                setDataSyncMsg('Sincronizando con Servidor...');
                try {
                    const res = await fetch(dataServerUrl);
                    const data = await res.json();
                    if (data.status === 'ok') {
                        if (Array.isArray(data.carpetas) && data.carpetas.length > 0) {
                            const hasContratosFolder = data.carpetas.some(c => c.nombre.toLowerCase() === CARPETA_CONTRATOS_NOMBRE.toLowerCase());
                            const mergedFolders = hasContratosFolder
                                ? data.carpetas
                                : [...data.carpetas, { id: "f-contratos", nombre: CARPETA_CONTRATOS_NOMBRE, url: CREDIBAN_VAULT.getMasterDriveUrl() }];
                            setFolders(mergedFolders);
                        }
                        if (Array.isArray(data.postulantes)) {
                            // Buscar si existe el registro maestro de configuración de Agencias en la nube
                            const configRecord = data.postulantes.find(item => String(item.id) === CLOUD_CONFIG_ID);
                            if (configRecord && configRecord.notasRubros && Array.isArray(configRecord.notasRubros.agencias) && configRecord.notasRubros.agencias.length > 0) {
                                const cloudAgencias = configRecord.notasRubros.agencias.map(a => a === 'HUAURA' ? 'HUANUCO' : a);
                                setAgencias(Array.from(new Set(cloudAgencias)));
                                localStorage.setItem('crediban_agencias_cloud_v5', JSON.stringify(Array.from(new Set(cloudAgencias))));
                            }

                            const localDeleted = JSON.parse(localStorage.getItem('crediban_deleted_ids_v5') || '[]');
                            const cleanList = data.postulantes
                                .filter(item => String(item.id) !== CLOUD_CONFIG_ID)
                                .map(normalizeApplicant)
                                .filter(item => !item.eliminado && !localDeleted.includes(String(item.id)));
                            setApplicants(cleanList);
                        }
                        setDataSyncMsg('Servidor Sincronizado ✅');
                    } else {
                        setDataSyncMsg('Conectado con aviso ⚠️');
                    }
                } catch (err) {
                    setDataSyncMsg('Modo Local Activo');
                }
            };

            React.useEffect(() => {
                fetchUsersFromMaster();
                fetchApplicantsAndFolders();
            }, []);

            React.useEffect(() => {
                try { localStorage.setItem('crediban_applicants_v5', JSON.stringify(applicants)); } catch (e) {}
            }, [applicants]);

            React.useEffect(() => {
                try { localStorage.setItem('crediban_drive_folders_v5', JSON.stringify(folders)); } catch (e) {}
            }, [folders]);

            React.useEffect(() => {
                try { localStorage.setItem('crediban_deleted_ids_v5', JSON.stringify(deletedIds)); } catch (e) {}
            }, [deletedIds]);

            React.useEffect(() => {
                try { localStorage.setItem('crediban_agencias_cloud_v5', JSON.stringify(agencias)); } catch (e) {}
            }, [agencias]);

            // ========================================================================
            // GESTIÓN DE AGENCIAS SINCRONIZADA EN NUBE PARA TODOS LOS DISPOSITIVOS
            // ========================================================================
            const saveAgenciasToCloud = async (newAgenciasList) => {
                setIsAgencySyncing(true);
                try {
                    const cleanList = Array.from(new Set(newAgenciasList.map(a => String(a || '').trim().toUpperCase()).filter(Boolean)));
                    setAgencias(cleanList);
                    localStorage.setItem('crediban_agencias_cloud_v5', JSON.stringify(cleanList));

                    await fetch(dataServerUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'saveApplicant',
                            data: {
                                id: CLOUD_CONFIG_ID,
                                fechaRegistro: new Date().toLocaleDateString('es-PE'),
                                dni: "00000000",
                                nombre: "CONFIGURACION_GLOBAL_AGENCIAS",
                                celular: "",
                                puesto: "Sistema",
                                sede: "TODAS",
                                carpetaNombre: "General",
                                calificacion: 0,
                                notasRubros: {
                                    eliminado: true,
                                    agencias: cleanList,
                                    actualizadoPor: currentUser?.usuario || "Gerencia",
                                    fecha: new Date().toISOString()
                                },

                    });
                } catch (err) {

                } finally {
                    setIsAgencySyncing(false);

            };

            const handleAddAgency = async () => {
                const clean = String(newAgencyName || '').trim().toUpperCase();
                if (!clean) return;
                if (agencias.includes(clean)) {
                    alert("Esa agencia ya existe en el listado.");
                    return;
                }
                const updated = [...agencias, clean];
                setNewAgencyName('');
                await saveAgenciasToCloud(updated);
            };

            const handleRenameAgency = async (oldName) => {
                const cleanNew = String(editingAgencyNew || '').trim().toUpperCase();
                if (!cleanNew || cleanNew === oldName) {
                    setEditingAgencyOld(null);
                    return;
                }
                const updatedAgencias = agencias.map(a => a === oldName ? cleanNew : a);
                setEditingAgencyOld(null);
                await saveAgenciasToCloud(updatedAgencias);

                // Actualizar también a los candidatos/contratos que tenían la agencia anterior
                const affected = applicants.filter(a => a.sede === oldName);
                setApplicants(prev => prev.map(a => a.sede === oldName ? { ...a, sede: cleanNew } : a));
                for (let person of affected) {
                    syncApplicantToServer({ ...person, sede: cleanNew });
                }
            };

            const handleDeleteAgency = async (targetAgency) => {
                if (agencias.length <= 1) {
                    alert("Debe quedar al menos una agencia activa.");
                    return;
                }
                const count = applicants.filter(a => a.sede === targetAgency).length;
                const ok = confirm(`¿Seguro que deseas quitar la agencia "${targetAgency}" de la lista global de todos los dispositivos?${count > 0 ? `\n\nNota: Hay ${count} registros con esa agencia.` : ''}`);
                if (!ok) return;
                const updated = agencias.filter(a => a !== targetAgency);
                await saveAgenciasToCloud(updated);
            };

            // ========================================================================
            // FUNCIONES DE SUBIDA Y SINCRONIZACIÓN CON SERVIDOR
            // ========================================================================
            const fileToBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = err => reject(err);
                    reader.readAsDataURL(file);
                });
            };

            const syncApplicantToServer = async (applicantPayload) => {
                try {
                    const res = await fetch(dataServerUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'saveApplicant',
                            data: applicantPayload
                        })
                    });
                    return await res.json();
                } catch (err) {
                    return null;
                }
            };

            // Auto-calcular Fecha Fin de Contrato cuando cambia Fecha Inicio o Plazo
            const handleContractPlazoChange = (newPlazoLabel, customStartDate = contractFechaInicio) => {
                setContractPlazoLabel(newPlazoLabel);
                const found = PLAZOS_CONTRATO.find(p => p.label === newPlazoLabel);
                if (found && found.months > 0 && customStartDate) {
                    setContractFechaFin(addMonthsToDateString(customStartDate, found.months));
                } else if (found && found.months === 0) {
                    setContractFechaFin("");
                }
            };

            // Detector de duplicados en tiempo real (DNI, Celular o Nombre)
            const duplicateWarnings = React.useMemo(() => {
                const warnings = [];
                const cleanDni = String(formDni || '').trim();
                const cleanCel = String(formCelular || '').replace(/\D/g, '').trim();
                const cleanName = String(formNombre || '').trim().toUpperCase();

                applicants.forEach(app => {
                    const appDni = String(app.dni || '').trim();
                    const appCel = String(app.celular || '').replace(/\D/g, '').trim();
                    const appName = String(app.nombre || '').trim().toUpperCase();

                    if (cleanDni.length >= 7 && appDni === cleanDni) {
                        warnings.push({ tipo: "DNI DUPLICADO", valor: cleanDni, candidato: app });
                    }
                    if (cleanCel.length >= 9 && appCel === cleanCel) {
                        warnings.push({ tipo: "CELULAR DUPLICADO", valor: cleanCel, candidato: app });
                    }
                    if (cleanName.length >= 7 && appName === cleanName) {
                        warnings.push({ tipo: "NOMBRE Y APELLIDO DUPLICADO", valor: cleanName, candidato: app });
                    }
                });
                return warnings;
            }, [formDni, formCelular, formNombre, applicants]);

            // Eliminar Candidato o Contrato
            const handleDeleteRecord = async (appToDelete) => {
                if (!appToDelete) return;
                const ok = confirm(`⚠️ ¿Estás seguro de ELIMINAR permanentemente el registro de "${appToDelete.nombre}" (DNI: ${appToDelete.dni})?`);
                if (!ok) return;

                const targetId = String(appToDelete.id);
                setDeletedIds(prev => [...prev, targetId]);
                setApplicants(prev => prev.filter(item => String(item.id) !== targetId));
                if (detailApplicant && String(detailApplicant.id) === targetId) {
                    setDetailApplicant(null);
                }

                try {
                    const tombstone = {
                        ...appToDelete,
                        estado: "ELIMINADO",
                        notasRubros: { ...(appToDelete.notasRubros || {}), eliminado: true }
                    };
                    await syncApplicantToServer(tombstone);
                    await fetch(dataServerUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'deleteApplicant', id: targetId })
                    });
                } catch (e) {}

            // ========================================================================

                    setFormCelular(extracted.celular || "");
                    setFormResidencia(extracted.residencia || "");

                        setFormSede(extracted.sedeSugerida);
                    } else if (agencias.length > 0) {
                        setFormSede(agencias[0]);

            const handleConfirmAndSaveApplicant = async (e) => {

                                verificacionDomicilio: "Pendiente de verificación"

                        estado: "En Evaluación",
                        comentarioActual: formComentarioInit.trim() || "Pendiente de calificación y verificación gerencial.",
                        evaluadoPor: gerenteNombre,
                        fechaEvaluacion: `${fechaStr} ${horaStr}`,
                        historial: [{
                            gerente: gerenteNombre,
                            sede: currentUser.sede,
                            fecha: `${fechaStr} ${horaStr}`,
                            estado: "En Evaluación",
                            nota: 0,
                            comentario: formComentarioInit.trim() || `Candidato registrado por ${gerenteNombre} (${fileName || 'Manual'}).`
                        }]
                    });

                    const serverResp = await syncApplicantToServer({
                        ...newApplicant,
                        fileBase64,

                    });

                    if (serverResp && serverResp.status === 'ok') {
                        if (serverResp.driveId) newApplicant.driveId = serverResp.driveId;
                        if (serverResp.urlCvPreview) newApplicant.urlCvPreview = serverResp.urlCvPreview;
                        if (serverResp.urlCvDownload) newApplicant.urlCvDownload = serverResp.urlCvDownload;
                        if (serverResp.carpetaId) newApplicant.carpetaId = serverResp.carpetaId;
                    }

                    setApplicants(prev => [newApplicant, ...prev]);
                    setExpandedCardIds(prev => ({ ...prev, [newApplicant.id]: true }));

                    setSelectedFile(null);
                    setIsConfirmationStep(false);
                    setFormNombre('');
                    setFormDni('');
                    setFormCelular('');
                    setFormResidencia('');
                    setFormBiografiaIAInit('');
                    setFormComentarioInit('');
                    setInlineFolderName('');
                    setShowInlineNewFolder(false);
                    setIsUploadModalOpen(false);
                } catch (err) {
                    alert("Error al guardar candidato: " + err.message);
                } finally {
                    setIsSaving(false);
                }
            };

            // ========================================================================
            // 2. ACTUALIZAR FICHA, INDICADORES O BIOGRAFÍA IA
            // ========================================================================
            const handleUpdateApplicantQuick = async (updatedApp, customHistoryNote = "") => {
                setIsSaving(true);
                try {
                    const ahora = new Date();
                    const fechaHora = `${ahora.toLocaleDateString('es-PE')} ${ahora.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })}`;
                    const gerenteNombre = currentUser.usuario;

                    const exp = Number(updatedApp.notasRubros?.exp) || 0;
                    const act = Number(updatedApp.notasRubros?.act) || 0;
                    const tec = Number(updatedApp.notasRubros?.tec) || 0;
                    const promedio = (exp > 0 || act > 0 || tec > 0)
                        ? Number(((exp + act + tec) / ((exp > 0 ? 1 : 0) + (act > 0 ? 1 : 0) + (tec > 0 ? 1 : 0))).toFixed(1))
                        : Number(updatedApp.calificacion) || 0;

                    let historialActualizado = Array.isArray(updatedApp.historial) ? [...updatedApp.historial] : [];
                    if (customHistoryNote) {
                        historialActualizado = [
                            {
                                gerente: gerenteNombre,
                                sede: currentUser.sede,
                                fecha: fechaHora,
                                estado: updatedApp.estado,
                                nota: promedio,
                                comentario: customHistoryNote
                            },
                            ...historialActualizado
                        ];
                    }

                    let fileBase64 = "";
                    let fileName = "";
                    let fileMimeType = "";

                    if (replaceCvFile && detailApplicant && detailApplicant.id === updatedApp.id) {
                        fileBase64 = await fileToBase64(replaceCvFile);
                        fileName = replaceCvFile.name;
                        fileMimeType = replaceCvFile.type || (fileName.toLowerCase().endsWith('.docx') ? "application/vnd.openxmlformats-officedocument.wordprocessingml.document" : fileName.toLowerCase().endsWith('.doc') ? "application/msword" : "application/pdf");
                        updatedApp.urlCvPreview = fileBase64;
                        updatedApp.urlCvDownload = fileBase64;
                        if (updatedApp.notasRubros && updatedApp.notasRubros.ficha) {
                            updatedApp.notasRubros.ficha.nombreArchivoOriginal = fileName;
                        }
                    }

                    const finalObj = normalizeApplicant({
                        ...updatedApp,
                        calificacion: promedio,
                        evaluadoPor: gerenteNombre,
                        fechaEvaluacion: fechaHora,
                        comentarioActual: customHistoryNote || updatedApp.comentarioActual,
                        historial: historialActualizado
                    });

                    setApplicants(prev => prev.map(item => item.id === finalObj.id ? finalObj : item));
                    if (detailApplicant && detailApplicant.id === finalObj.id) {
                        setDetailApplicant(finalObj);
                    }

                    const resp = await syncApplicantToServer({
                        ...finalObj,
                        moverACarpeta: true,
                        fileBase64,
                        fileName,
                        fileMimeType
                    });

                    if (resp && resp.status === 'ok') {
                        if (resp.driveId) finalObj.driveId = resp.driveId;
                        if (resp.urlCvPreview) finalObj.urlCvPreview = resp.urlCvPreview;
                        if (resp.urlCvDownload) finalObj.urlCvDownload = resp.urlCvDownload;
                        setApplicants(prev => prev.map(item => item.id === finalObj.id ? finalObj : item));
                        if (detailApplicant && detailApplicant.id === finalObj.id) {
                            setDetailApplicant(finalObj);
                        }
                    }
                    setReplaceCvFile(null);
                    setNewCommentText('');

                    console.error("Error actualizando candidato:", err);
                } finally {
                    setIsSaving(false);
                }
            };

            // ========================================================================

                setContractModalMode(personObj ? mode : 'NUEVO');

                if (personObj) {
                    const ficha = personObj.notasRubros?.ficha || {};
