        // Utilidades para fechas y cálculo de vencimientos de contratos
        const addMonthsToDateString = (yyyyMmDd, monthsToAdd) => {
            if (!yyyyMmDd || !monthsToAdd || Number(monthsToAdd) <= 0) return "";
            const parts = yyyyMmDd.split("-");
            if (parts.length !== 3) return "";
            const dt = new Date(Number(parts[0]), Number(parts[1]) - 1 + Number(monthsToAdd), Number(parts[2]));
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const formatDateDisplay = (yyyyMmDd) => {
            if (!yyyyMmDd) return "-";
            if (yyyyMmDd.includes("/")) return yyyyMmDd;
            const parts = yyyyMmDd.split("-");
            if (parts.length !== 3) return yyyyMmDd;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        };

        const calculateDaysRemaining = (fechaFinYyyyMmDd, plazoLabel = "") => {
            if (String(plazoLabel).toLowerCase().includes("indeterminado")) return 9999;
            if (!fechaFinYyyyMmDd) return null;
            const parts = fechaFinYyyyMmDd.split("-");
            if (parts.length !== 3) return null;
            const end = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 23, 59, 59);
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
            const diffTime = end.getTime() - todayStart.getTime();
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

        const getContractStatusInfo = (contratoObj) => {
            if (!contratoObj || !contratoObj.activo) {
                return { code: 'SIN_CONTRATO', label: 'Sin Contrato Activo', badgeCls: 'bg-slate-100 text-slate-600 border-slate-300', days: null };

            }
            const days = calculateDaysRemaining(contratoObj.fechaFin, contratoObj.plazoLabel);

                return { code: 'VIGENTE', label: '⚪ Fecha fin pendiente', badgeCls: 'bg-slate-100 text-slate-700 border-slate-300', days: null };

        // ============================================================================
        // 4. MOTOR DE LECTURA AUTOMÁTICA DEL PDF (NOMBRE, DNI, CELULAR, RESIDENCIA)
        // ============================================================================
        async function extractCandidateDataFromPDF(file) {
            let fullText = "";
            let topLines = [];

            if (file && file.type === "application/pdf" && window.pdfjsLib) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    const maxPages = Math.min(pdf.numPages, 3);

                    for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();

                        const lineBuckets = {};
                        textContent.items.forEach(item => {
                            const str = (item.str || "").trim();
                            if (!str) return;
                            const y = Math.round(item.transform[5] / 4) * 4;
                            if (!lineBuckets[y]) lineBuckets[y] = [];
                            lineBuckets[y].push({ x: item.transform[4], text: str });
                        });

                        const sortedYs = Object.keys(lineBuckets).map(Number).sort((a, b) => b - a);
                        const pageLines = sortedYs.map(y => {
                            const sortedItems = lineBuckets[y].sort((a, b) => a.x - b.x);
                            return sortedItems.map(i => i.text).join(" ").replace(/\s+/g, " ").trim();
                        }).filter(Boolean);

                        if (pageNum === 1) topLines = pageLines.slice(0, 18);
                        fullText += pageLines.join("\n") + "\n";
                    }
                } catch (err) {
                    console.warn("Aviso leyendo PDF:", err);
                }
            }

            const cleanFileName = (file ? file.name : "")
                .replace(/\.(pdf|docx|doc|jpg|jpeg|png)$/i, "")
                .replace(/^(cv|curriculum|vitae|hoja_de_vida|postulante|contrato)[_\-\s]*/i, "")
                .replace(/[_\-]+/g, " ")
                .trim();

            // 1. DNI
            let dni = "";
            const dniExplicit = fullText.match(/(?:D\.?N\.?I\.?|DOCUMENTO\s+DE\s+IDENTIDAD|DOC\.?\s*IDENTIDAD|NRO\.?\s*DOC|IDENTIFICACIÓN)\s*[:º°#\-]?\s*([014678]\d{7})\b/i);
            if (dniExplicit) {
                dni = dniExplicit[1];
            } else {
                const all8Digits = fullText.match(/\b([014678]\d{7})\b/g);
                if (all8Digits && all8Digits.length > 0) dni = all8Digits[0];
                else {
                    const fileDni = cleanFileName.match(/\b([014678]\d{7})\b/);
                    if (fileDni) dni = fileDni[1];
                }
            }

            // 2. CELULAR
            let celular = "";
            const phoneMatches = fullText.match(/(?:\+?51[\s\-]?)?(9\d{2}[\s\-]?\d{3}[\s\-]?\d{3}|9\d{8})\b/g);
            if (phoneMatches && phoneMatches.length > 0) {
                for (let rawPhone of phoneMatches) {
                    const digits = rawPhone.replace(/\D/g, "");
                    const nineDigits = digits.length === 11 && digits.startsWith("51") ? digits.slice(2) : digits;
                    if (nineDigits.length === 9 && nineDigits.startsWith("9") && nineDigits !== dni) {
                        celular = nineDigits;
                        break;
                    }
                }
            }

            // 3. NOMBRE Y APELLIDOS
            let nombre = "";
            const nameExplicit = fullText.match(/(?:NOMBRES?\s+Y\s+APELLIDOS?|APELLIDOS?\s+Y\s+NOMBRES?|NOMBRE\s+COMPLETO|POSTULANTE)\s*[:\-]\s*([A-ZÁÉÍÓÚÑ][A-Za-záéíóúñÁÉÍÓÚÑ\s,]{5,55})/i);
            if (nameExplicit) {
                nombre = nameExplicit[1].replace(/,/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
            } else {
                const bannedWords = /^(CURRICULUM|CURRÍCULUM|VITAE|HOJA DE VIDA|RESUMEN|PERFIL|CONTACTO|DATOS PERSONALES|EXPERIENCIA|EDUCACIÓN|EDUCACION|FORMACIÓN|FORMACION|HABILIDADES|REFERENCIAS|OBJETIVO|SOBRE MI|SOBRE MÍ|ASESOR|CAJERO|CAJA|HUACHO|HUARAZ|ICA|HUAURA|LIMA|PERÚ|PERU|DIRECCIÓN|DIRECCION|TELÉFONO|TELEFONO|CELULAR|CORREO|EMAIL)/i;
                for (let line of topLines) {
                    const cleanLine = line.replace(/[^A-Za-záéíóúñÁÉÍÓÚÑ\s]/g, " ").replace(/\s+/g, " ").trim();
                    const words = cleanLine.split(" ").filter(w => w.length >= 2);
                    if (
                        words.length >= 2 &&
                        words.length <= 6 &&
                        cleanLine.length >= 7 &&
                        cleanLine.length <= 52 &&
                        !bannedWords.test(cleanLine) &&
                        !/\d/.test(line) &&
                        !line.includes("@")
                    ) {
                        nombre = cleanLine.toUpperCase();
                        break;
                    }
                }
            }
            if (!nombre && cleanFileName) {
                const fromFile = cleanFileName.replace(/\d+/g, "").replace(/\s+/g, " ").trim();
                if (fromFile.length >= 4) nombre = fromFile.toUpperCase();
            }

            // 4. LUGAR DE RESIDENCIA Y SEDE
            let residencia = "";
            const dirExplicit = fullText.match(/(?:DIRECCI[ÓO]N|DOMICILIO|LUGAR\s+DE\s+RESIDENCIA|RESIDENCIA|UBICACI[ÓO]N|DISTRITO|CIUDAD)\s*[:\-]\s*([^\n\r]{4,75})/i);
            if (dirExplicit) {
                residencia = dirExplicit[1].trim();
            } else {
                const streetMatch = fullText.match(/\b((?:Av\.|Avenida|Jr\.|Jirón|Calle|Ca\.|Urb\.|Urbanización|Psje\.|Pasaje|Mz\.|Asoc\.|AA\.HH\.)\s+[^\n\r]{5,60})/i);
                if (streetMatch) residencia = streetMatch[1].trim();
            }

            const ciudadesPeru = [
                { pattern: /\b(HUACHO|HUALMAY|SANTA\s+MAR[IÍ]A|V[EÉ]GUETA|SAY[AÁ]N|CARQU[IÍ]N)\b/i, ciudad: "Huacho", sede: "HUACHO" },
                { pattern: /\b(HUARAZ|INDEPENDENCIA\s*-\s*HUARAZ|CARHUAZ|YUNGAY|CARAZ|RECUAY|ANCASH|ÁNCASH)\b/i, ciudad: "Huaraz", sede: "HUARAZ" },
                { pattern: /\b(ICA|PARCONA|LA\s+TINGUI[ÑN]A|SUBTANJALLA|LOS\s+AQUIJES|CHINCHA|PISCO|NAZCA)\b/i, ciudad: "Ica", sede: "ICA" },
                { pattern: /\b(HUAURA|BARRANCA|SUPE|PARAMONGA|PATIVILCA|CHANCAY|HUARAL)\b/i, ciudad: "Huaura", sede: "HUAURA" },
                { pattern: /\b(LIMA|SAN\s+JUAN|ATE|COMAS|LOS\s+OLIVOS|CALLAO|SMP|VILLA\s+EL\s+SALVADOR|CHORRILLOS|MIRAFLORES|SURCO)\b/i, ciudad: "Lima", sede: "LIMA" }
            ];

            let sedeSugerida = "";
            for (let item of ciudadesPeru) {
                const m = fullText.match(item.pattern);
                if (m) {
                    sedeSugerida = item.sede;
                    if (!residencia) residencia = `${m[1].toUpperCase()} (${item.ciudad})`;
                    else if (!residencia.toUpperCase().includes(m[1].toUpperCase())) residencia = `${residencia} - ${m[1].toUpperCase()}`;
                    break;
                }
            }

            let puestoSugerido = "Asesor";
            if (/\b(CAJERO|CAJERA|VENTANILLA|CAJA\s+Y\s+ATENCI[ÓO]N|BOVEDA|BÓVEDA|CUADRE\s+DE\s+CAJA)\b/i.test(fullText)) {
                puestoSugerido = "Caja";
            }

            let estudiosSugeridos = "Por confirmar documentos";
            if (/\b(UNIVERSITARIO|UNIVERSIDAD|LICENCIAD[OA]|INGENIER[OA]|CONTADOR|ECONOMISTA)\b/i.test(fullText)) {
                estudiosSugeridos = /\b(TITULAD[OA]|BACHILLER|COLEGIAD[OA])\b/i.test(fullText)
                    ? "Universitario Confirmado (Titulado / Bachiller)"
                    : "Universitario En Curso / Egresado";
            } else if (/\b(INSTITUTO|T[EÉ]CNICO|T[EÉ]CNICA)\b/i.test(fullText)) {
                estudiosSugeridos = "Técnico Confirmado (Titulado / Egresado)";
            } else if (/\b(SECUNDARIA\s+COMPLETA)\b/i.test(fullText)) {
                estudiosSugeridos = "Secundaria Completa Confirmada";
            }

            return {
                nombre: nombre || "",
                dni: dni || "",
                celular: celular || "",
                residencia: residencia || "",

        // ============================================================================
        function LoginScreen({ users, loadingProgress, isFetchingUsers, syncMessage, onLoginSuccess, onRetrySync }) {
            const [usernameInput, setUsernameInput] = React.useState('');
            const [passwordInput, setPasswordInput] = React.useState('');
            const [rememberMe, setRememberMe] = React.useState(true);
            const [error, setError] = React.useState('');

            // Normalizar texto para comparar nombres sin importar tildes o mayúsculas/minúsculas
            const normalizeStr = (str) => String(str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');

                const cleanInputUser = normalizeStr(usernameInput);
                const cleanInputPass = String(passwordInput || '').trim();

                if (!cleanInputUser || !cleanInputPass) {
                    setError('⚠️ Por favor ingresa tu Usuario y Contraseña.');
                    return;
                }

                // Buscar coincidencia exacta de usuario y contraseña
                const matchedUser = users.find(u =>
                    normalizeStr(u.usuario) === cleanInputUser &&
                    String(u.clave).trim() === cleanInputPass
                );

                if (!matchedUser) {
                    // Verificar si el usuario existe pero falló la clave, sin revelar cargos ni lista
                    const userExists = users.find(u => normalizeStr(u.usuario) === cleanInputUser);
                    if (userExists && !String(userExists.cargo || '').toLowerCase().includes('gerente')) {
                        setError('⛔ ACCESO DENEGADO: Tus credenciales no cuentan con autorización de Gerencia para este sistema.');
                        return;
                    }
                    setError('🔒 Usuario o contraseña incorrectos. Verifica tus credenciales.');
                    return;
                }

                // Candado estricto: Solo rol Gerente
                if (!String(matchedUser.cargo || '').toLowerCase().includes('gerente')) {
                    setError('⛔ ACCESO RESTRINGIDO: Este módulo de Gestión de Personal y Contratos es exclusivo para Gerencia.');
                    return;
                }

                onLoginSuccess(matchedUser, rememberMe);
            };

            return (
                <div className="min-h-screen login-bg flex flex-col justify-center items-center p-5">
                    <div className="mb-5 animate-fade-in">
                        <OfficialLogo darkBg={true} />
                    </div>

                    <div className="bg-white/10 backdrop-blur-xl w-full max-w-md rounded-3xl shadow-2xl p-7 border border-white/20 border-t-8 border-t-[#59B447] animate-fade-in">
                        <div className="text-center mb-5">
                            <div className="inline-flex items-center gap-1.5 bg-[#59B447]/20 border border-[#59B447]/50 text-emerald-300 text-[11px] font-extrabold px-3.5 py-1 rounded-full uppercase tracking-wider mb-2">
                                🔒 Portal Privado de Gerencia
                            </div>
                            <h2 className="text-xl font-black text-white tracking-wide uppercase">Acceso al Sistema</h2>
                            <p className="text-xs text-slate-300 font-medium mt-0.5">Gestión de Personal, Postulantes y Contratos • CREDIBAN PERÚ</p>
                        </div>

                        {/* Barra de Sincronización con el Script Maestro de Usuarios */}
                        <div className="mb-5 bg-slate-900/60 p-2.5 rounded-2xl border border-slate-700/60">
                            <div className="flex justify-between items-center text-[11px] font-extrabold mb-1">
                                <span className="text-slate-300">
                                    {isFetchingUsers ? '🔄 Conectando con Servidor de Seguridad...' : `✅ ${syncMessage}`}
                                </span>
                                <div className="flex items-center gap-2">
                                    <span className="text-[#59B447]">{loadingProgress}%</span>
                                    <button type="button" onClick={onRetrySync} className="text-[10px] text-emerald-300 hover:underline">↻</button>
                                </div>
                            </div>
                            <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div
                                    className="h-full bg-gradient-to-r from-[#59B447] to-emerald-400 transition-all duration-300"
                                    style={{ width: `${loadingProgress}%` }}
                                />
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-[11px] font-extrabold text-slate-300 uppercase block mb-1.5 ml-1">
                                    Usuario Autorizado
                                </label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">👤</span>
                                    <input
                                        type="text"
                                        autoComplete="username"

                                        value={usernameInput}
                                        onChange={e => { setUsernameInput(e.target.value); setError(''); }}
                                        className="w-full bg-slate-900/80 border-2 border-slate-600/80 focus:border-[#59B447] text-white rounded-xl pl-10 pr-4 py-3 text-sm font-bold outline-none focus:ring-2 focus:ring-[#59B447]/30 transition-all"
                                        required
                                    />

                                <label className="text-[11px] font-extrabold text-slate-300 uppercase block mb-1.5 ml-1">

                                </label>

        }

                const fichaRaw = (rubrosRaw.ficha && typeof rubrosRaw.ficha === 'object') ? rubrosRaw.ficha : {};

                    ...raw,

            // Sincronizar Usuarios desde el Script Maestro
            const fetchUsersFromMaster = async () => {
                setIsFetchingUsers(true);
                setLoadingProgress(35);
                setUserSyncMsg('Sincronizando Usuarios...');

                const parseUsersArray = (rawList) => {
                    if (!Array.isArray(rawList)) return [];
                    return rawList.map(item => {
                        const usuario = String(item.usuario || item.Usuario || item.nombre || item.Nombre || '').trim();
                        const cargo = String(item.cargo || item.Cargo || item.rol || item.Rol || 'Trabajador').trim();
                        const sede = String(item.sede || item.Sede || 'TODAS').trim().toUpperCase();
                        const clave = String(item.clave !== undefined ? item.clave : (item.Clave !== undefined ? item.Clave : '')).trim();
                        const estado = String(item.estado || item.Estado || 'HABILITADO').trim().toUpperCase();
                        return { usuario, cargo, sede, clave, estado };
                    }).filter(u => u.usuario && u.estado !== 'DESHABILITADO' && u.estado !== 'INACTIVO');
                };

                try {
                    const res = await fetch(usersApiUrl);
                    setLoadingProgress(75);
                    const data = await res.json();
                    const rawList = Array.isArray(data) ? data : (data.usuarios || data.data || []);
                    const normalized = parseUsersArray(rawList);
                    if (normalized.length > 0) {
                        setUsers(normalized);
                        setLoadingProgress(100);
                        setUserSyncMsg('Base de Seguridad Activa');
                        setIsFetchingUsers(false);
                        return;

                try {

                    const res = await fetch(applicantsApiUrl);

            // Detector de duplicados en tiempo real (DNI, Celular o Nombre)
            const duplicateWarnings = React.useMemo(() => {
                const warnings = [];
                const cleanDni = String(formDni || '').trim();
                const cleanCel = String(formCelular || '').replace(/\D/g, '').trim();
                const cleanName = String(formNombre || '').trim().toUpperCase();

                applicants.forEach(app => {
                    const appDni = String(app.dni || '').trim();
                    const appCel = String(app.celular || '').replace(/\D/g, '').trim();
                    const appName = String(app.nombre || '').trim().toUpperCase();

                    if (cleanDni.length >= 7 && appDni === cleanDni) {
                        warnings.push({ tipo: "DNI DUPLICADO", valor: cleanDni, candidato: app });
                    }
                    if (cleanCel.length >= 9 && appCel === cleanCel) {
                        warnings.push({ tipo: "CELULAR DUPLICADO", valor: cleanCel, candidato: app });
                    }
                    if (cleanName.length >= 7 && appName === cleanName) {
                        warnings.push({ tipo: "NOMBRE Y APELLIDO DUPLICADO", valor: cleanName, candidato: app });
                    }
                });
                return warnings;
            }, [formDni, formCelular, formNombre, applicants]);

            const fileToBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = err => reject(err);
                    reader.readAsDataURL(file);
                });
            };

            const syncApplicantToServer = async (applicantPayload) => {
                try {
                    const res = await fetch(applicantsApiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'saveApplicant',
                            data: applicantPayload
                        })
                    });
                    return await res.json();
                } catch (err) {
                    return null;

            };

            // ========================================================================

            // ========================================================================

                    headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255], fontSize: 8.5 },
                    styles: { fontSize: 8, cellPadding: 2.2 }
                });

                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 5,
                    head: [['2. SECCIÓN BIOGRÁFICA / RESUMEN IA DEL PERFIL']],
                    body: [
                        [ficha.biografiaIA || 'Sin reseña biográfica registrada.']
                    ],
                    theme: 'grid',
                    headStyles: { fillColor: [89, 180, 71], textColor: [255, 255, 255], fontSize: 8.5 },
                    styles: { fontSize: 8, cellPadding: 2.5 }
                });

                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 5,
                    head: [['3. INDICADORES DE RIESGO, ANTECEDENTES Y VERIFICACIÓN', 'ESTADO']],
                    body: [
                        ['Denuncias Policiales / Demandas', `${ficha.denuncias} ${ficha.detalleDenuncias ? '(' + ficha.detalleDenuncias + ')' : ''}`],
                        ['Estado de Score Crediticio (Infocorp/SBS)', `${ficha.scoreCrediticio} ${ficha.detalleScore ? '(' + ficha.detalleScore + ')' : ''}`],
                        ['Estudios Confirmados', `${ficha.estudios} ${ficha.detalleEstudios ? '(' + ficha.detalleEstudios + ')' : ''}`],
                        ['Número de Hijos / Carga Familiar', ficha.hijos || '0 (Sin hijos)'],
                        ['Experiencia en Financieras / Caja', ficha.expFinanciera || '-'],
                        ['Movilidad Propia / Licencia', ficha.movilidad || '-'],
                        ['Referencias Laborales y Domicilio', `${ficha.referencias || '-'}   |   ${ficha.verificacionDomicilio || '-'}`]
                    ],
                    theme: 'grid',
                    headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255], fontSize: 8.5 },
                    styles: { fontSize: 8, cellPadding: 2.2 }
                });

                if (contrato.activo) {
                    const stInfo = getContractStatusInfo(contrato);
                    doc.autoTable({
                        startY: doc.lastAutoTable.finalY + 5,
                        head: [['4. DATOS DE CONTRATO VIGENTE Y RENOVACIÓN', 'DETALLE']],
                        body: [
                            ['Modalidad / Tipo de Contrato', contrato.tipoContrato || '-'],
                            ['Fecha de Inicio y Fecha de Renovación', `Inicio: ${formatDateDisplay(contrato.fechaInicio)}   |   Vencimiento: ${formatDateDisplay(contrato.fechaFin)} (${contrato.plazoLabel})`],
                            ['Sueldo Básico y Estado de Vigencia', `S/ ${contrato.sueldo || '-'}   |   ${stInfo.label}`]
                        ],
                        theme: 'grid',
                        headStyles: { fillColor: [89, 180, 71], textColor: [255, 255, 255], fontSize: 8.5 },
                        styles: { fontSize: 8, cellPadding: 2.2 }
                    });
                }

                doc.save(`Ficha_${app.puesto}_${app.dni}_${app.nombre.replace(/\s+/g, '_')}.pdf`);
            };

            const exportContractsReportPDF = async () => {
                if (filteredContractsList.length === 0) {
                    alert("No hay contratos en la lista actual para exportar.");
                    return;
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');
                const fecha = new Date().toLocaleDateString('es-PE');

                doc.setFillColor(255, 255, 255);
                doc.rect(0, 0, 297, 26, 'F');
                doc.setFillColor(89, 180, 71);
                doc.rect(0, 24, 297, 2, 'F');

                const logoBase64 = await getLogoBase64ForPDF();
                if (logoBase64) doc.addImage(logoBase64, 'PNG', 12, 3, 13, 18);

                doc.setFont("times", "bold");
                doc.setFontSize(20);
                doc.setTextColor(89, 180, 71);
                doc.text("CREDIBAN", 28, 12);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(7);
                doc.text("EMPIEZA A CONSTRUIR TUS SUEÑOS", 28, 17);

                doc.setFontSize(13);
                doc.setTextColor(30, 41, 59);
                doc.text("REPORTE GERENCIAL DE CONTRATOS Y CONTROL DE RENOVACIONES", 105, 11);
                doc.setFontSize(9);
                doc.setTextColor(71, 85, 105);
                doc.text(`Gerente: ${currentUser.usuario}   |   Fecha: ${fecha}   |   Total Contratos Listados: ${filteredContractsList.length}`, 105, 18);

                const body = filteredContractsList.map((p, idx) => {
                    const c = p.notasRubros?.ficha?.contrato || {};
                    const st = getContractStatusInfo(c);
                    return [
                        idx + 1,
                        p.dni,
                        p.nombre,
                        `${p.puesto} (${p.sede})`,
                        c.tipoContrato || '-',
                        `S/ ${c.sueldo || '0'}`,
                        c.plazoLabel || '-',
                        formatDateDisplay(c.fechaInicio),
                        formatDateDisplay(c.fechaFin),
                        st.label.replace(/[🟢🟡🟠🔴⚪]/g, '').trim()
                    ];
                });

                doc.autoTable({
                    startY: 30,
                    head: [['#', 'DNI', 'Asesor / Colaborador', 'Cargo y Sede', 'Tipo de Contrato', 'Sueldo', 'Plazo', 'Fecha Inicio', 'Fecha Renovación', 'Estado de Renovación']],
                    body,
                    theme: 'grid',
                    headStyles: { fillColor: [89, 180, 71], textColor: [255, 255, 255], fontSize: 8 },
                    styles: { fontSize: 7.5, cellPadding: 2 }
                });

                doc.save(`Contratos_Renovaciones_CREDIBAN_${fecha.replace(/\//g, '-')}.pdf`);
            };

            // ========================================================================
            // FILTROS DE POSTULANTES Y FILTROS DE CONTRATOS
            // ========================================================================
            const filteredApplicants = React.useMemo(() => {
                return applicants
                    .filter(a => {
                        if (a.eliminado) return false;
                        const f = a.notasRubros?.ficha || {};
                        const matchEstado = filterEstado === 'TODOS' || a.estado === filterEstado;
                        const matchPuesto = filterPuesto === 'TODOS' || a.puesto === filterPuesto;
                        const matchSede = filterSede === 'TODAS' || a.sede === filterSede;
                        const matchCarpeta = filterCarpeta === 'TODAS' || (a.carpetaNombre || 'General') === filterCarpeta;

                        const nota = Number(a.calificacion) || 0;
                        let matchNota = true;
                        if (filterNota === 'DESTACADOS') matchNota = nota >= 4.0;
                        else if (filterNota === 'REGULARES') matchNota = nota >= 3.0 && nota < 4.0;
                        else if (filterNota === 'BAJOS') matchNota = nota > 0 && nota < 3.0;
                        else if (filterNota === 'SIN_CALIFICAR') matchNota = nota === 0;

                        let matchDenuncias = true;
                        if (filterDenuncias === 'LIMPIOS') matchDenuncias = String(f.denuncias).includes('Limpio');
                        else if (filterDenuncias === 'CON_DENUNCIAS') matchDenuncias = String(f.denuncias).includes('Con denuncias') || String(f.denuncias).includes('Con demandas');
                        else if (filterDenuncias === 'PENDIENTES') matchDenuncias = String(f.denuncias).includes('Pendiente');

                        let matchScore = true;
                        if (filterScore === 'BUENO') matchScore = String(f.scoreCrediticio).includes('Normal') || String(f.scoreCrediticio).includes('Sin Historial');
                        else if (filterScore === 'OBSERVADO') matchScore = String(f.scoreCrediticio).includes('CPP') || String(f.scoreCrediticio).includes('Deficiente') || String(f.scoreCrediticio).includes('Pérdida');

                        const q = searchQuery.toLowerCase().trim();
                        const matchQuery = !q ||
                            String(a.nombre || '').toLowerCase().includes(q) ||
                            String(a.dni || '').toLowerCase().includes(q) ||
                            String(a.celular || '').toLowerCase().includes(q) ||
                            String(f.residencia || '').toLowerCase().includes(q) ||
                            String(f.biografiaIA || '').toLowerCase().includes(q) ||
                            String(a.comentarioActual || '').toLowerCase().includes(q);

                        return matchEstado && matchPuesto && matchSede && matchCarpeta && matchNota && matchDenuncias && matchScore && matchQuery;
                    })
                    .sort((a, b) => {
                        if (sortBy === 'MEJOR_NOTA') return (Number(b.calificacion) || 0) - (Number(a.calificacion) || 0);
                        if (sortBy === 'MENOR_NOTA') return (Number(a.calificacion) || 0) - (Number(b.calificacion) || 0);
                        return 0;
                    });
            }, [applicants, filterEstado, filterPuesto, filterSede, filterCarpeta, filterNota, filterDenuncias, filterScore, searchQuery, sortBy]);

            // Lista de Personal con Contrato Activo ordenada por urgencia de renovación
            const allContractsList = React.useMemo(() => {
                return applicants
                    .filter(a => !a.eliminado && a.notasRubros?.ficha?.contrato?.activo)
                    .sort((a, b) => {
                        const stA = getContractStatusInfo(a.notasRubros?.ficha?.contrato);
                        const stB = getContractStatusInfo(b.notasRubros?.ficha?.contrato);
                        const dA = stA.days === null ? 9998 : stA.days;
                        const dB = stB.days === null ? 9998 : stB.days;
                        return dA - dB;
                    });
            }, [applicants]);

            const filteredContractsList = React.useMemo(() => {
                return allContractsList.filter(p => {
                    const c = p.notasRubros?.ficha?.contrato || {};
                    const st = getContractStatusInfo(c);

                    let matchAlerta = true;
                    if (filterContratoAlerta === 'VENCIDOS') matchAlerta = st.code === 'VENCIDO';
                    else if (filterContratoAlerta === 'URGENTES') matchAlerta = st.code === 'URGENTE' || st.code === 'VENCIDO';
                    else if (filterContratoAlerta === 'PROXIMOS') matchAlerta = st.code === 'PROXIMO';
                    else if (filterContratoAlerta === 'VIGENTES') matchAlerta = st.code === 'VIGENTE';

                    const matchSede = filterContratoSede === 'TODAS' || p.sede === filterContratoSede;
                    const matchPuesto = filterContratoPuesto === 'TODOS' || p.puesto === filterContratoPuesto;

                    const q = searchContrato.toLowerCase().trim();
                    const matchQ = !q ||
                        String(p.nombre || '').toLowerCase().includes(q) ||
                        String(p.dni || '').toLowerCase().includes(q) ||
                        String(c.tipoContrato || '').toLowerCase().includes(q);

                    return matchAlerta && matchSede && matchPuesto && matchQ;
                });
            }, [allContractsList, filterContratoAlerta, filterContratoSede, filterContratoPuesto, searchContrato]);

            const getEstadoStyle = (estado) => {
                if (estado === 'Apto') return 'bg-emerald-100 text-emerald-900 border-emerald-400';
                if (estado === 'No Apto') return 'bg-red-100 text-red-900 border-red-400';
                if (estado === 'Programado para Entrevista') return 'bg-blue-100 text-blue-900 border-blue-400';
                return 'bg-amber-100 text-amber-900 border-amber-400';
            };

            const getDenunciaBadge = (val) => {
                const s = String(val || '');
                if (s.includes('Limpio')) return { cls: 'bg-emerald-50 text-emerald-800 border-emerald-300', icon: '🟢' };
                if (s.includes('policiales')) return { cls: 'bg-red-50 text-red-800 border-red-300', icon: '🔴' };
                if (s.includes('demandas')) return { cls: 'bg-orange-50 text-orange-800 border-orange-300', icon: '🟠' };
                return { cls: 'bg-slate-100 text-slate-600 border-slate-300', icon: '⏳' };
            };

            const getScoreBadge = (val) => {
                const s = String(val || '');
                if (s.includes('Normal')) return { cls: 'bg-emerald-50 text-emerald-800 border-emerald-300', icon: '🟢' };
                if (s.includes('Sin Historial')) return { cls: 'bg-sky-50 text-sky-800 border-sky-300', icon: '🔵' };
                if (s.includes('CPP')) return { cls: 'bg-amber-50 text-amber-800 border-amber-300', icon: '🟡' };
                if (s.includes('Deficiente') || s.includes('Pérdida')) return { cls: 'bg-red-50 text-red-800 border-red-300', icon: '🔴' };
                return { cls: 'bg-slate-100 text-slate-600 border-slate-300', icon: '⏳' };
            };

            // SI NO HAY SESIÓN DE GERENTE ACTIVA, MOSTRAR PANTALLA DE BLOQUEO CERRADA
            if (!currentUser) {
                return (
                    <LoginScreen
                        users={users}
                        loadingProgress={loadingProgress}
                        isFetchingUsers={isFetchingUsers}
                        syncMessage={userSyncMsg}
                        onRetrySync={fetchUsersFromMaster}
                        onLoginSuccess={(u, rem) => {
                            setCurrentUser(u);
                            if (rem) localStorage.setItem('crediban_gerente_rrhh_session_v4', JSON.stringify(u));
                        }}
                    />
                );
            }

            const countAptos = applicants.filter(a => !a.eliminado && a.estado === 'Apto').length;
            const countNoAptos = applicants.filter(a => !a.eliminado && a.estado === 'No Apto').length;
            const countEntrevista = applicants.filter(a => !a.eliminado && a.estado === 'Programado para Entrevista').length;
            const countEnEvaluacion = applicants.filter(a => !a.eliminado && a.estado === 'En Evaluación').length;

            const contratosUrgentesCount = allContractsList.filter(p => {
                const code = getContractStatusInfo(p.notasRubros?.ficha?.contrato).code;
                return code === 'VENCIDO' || code === 'URGENTE';
            }).length;
            const contratosProximosCount = allContractsList.filter(p => getContractStatusInfo(p.notasRubros?.ficha?.contrato).code === 'PROXIMO').length;

            return (
                <div className="min-h-screen bg-slate-100 pb-20">
                    {/* ====================================================================
                        CABECERA OFICIAL CREDIBAN CON NAVEGACIÓN DE PESTAÑAS Y PERFIL GERENTE
                    ==================================================================== */}
                    <header className="bg-slate-900 text-white sticky top-0 z-30 shadow-xl border-b-4 border-[#59B447]">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex flex-wrap items-center gap-3">
                                <OfficialLogo compact={true} />

                                {/* Selector de Módulo Principal: Postulantes vs Contratos y Renovaciones */}
                                <div className="flex items-center bg-slate-800 p-1 rounded-2xl border border-slate-700">
                                    <button
                                        onClick={() => setActiveMainTab('POSTULANTES')}
                                        className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-1.5 ${
                                            activeMainTab === 'POSTULANTES'
                                                ? 'bg-[#59B447] text-white shadow-md'
                                                : 'text-slate-300 hover:text-white'
                                        }`}
                                    >
                                        <span>👥 Evaluación de Postulantes</span>
                                        <span className="bg-black/25 px-1.5 py-0.5 rounded-full text-[10px]">{applicants.length}</span>
                                    </button>
                                    <button
                                        onClick={() => setActiveMainTab('CONTRATOS')}
                                        className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-1.5 ${
                                            activeMainTab === 'CONTRATOS'
                                                ? 'bg-[#59B447] text-white shadow-md'
                                                : 'text-slate-300 hover:text-white'
                                        }`}
                                    >
                                        <span>📜 Contratos y Renovaciones</span>
                                        <span className={`px-1.5 py-0.5 rounded-full text-[10px] ${contratosUrgentesCount > 0 ? 'bg-red-500 text-white animate-pulse' : 'bg-black/25'}`}>
                                            {allContractsList.length}
                                        </span>
                                    </button>
                                </div>
                            </div>

                            {/* Perfil del Gerente Conectado */}
                            <div className="flex items-center gap-2.5 bg-slate-800/90 px-3.5 py-2 rounded-2xl border border-slate-700">
                                <div className="w-8 h-8 rounded-xl bg-[#59B447] text-white font-black flex items-center justify-center text-sm shadow">
                                    {currentUser.usuario.charAt(0).toUpperCase()}
                                </div>
                                <div className="leading-tight">
                                    <div className="text-xs font-black tracking-wide flex items-center gap-1.5">
                                        <span>{currentUser.usuario}</span>
                                        <span className="bg-amber-400 text-slate-900 text-[9px] font-black px-1.5 py-0.5 rounded uppercase">
                                            GERENTE
                                        </span>
                                    </div>
                                    <div className="text-[10px] text-emerald-300 font-semibold">
                                        Sede: {currentUser.sede} • {dataSyncMsg}
                                    </div>
                                </div>
                                <button
                                    onClick={() => {
                                        localStorage.removeItem('crediban_gerente_rrhh_session_v4');
                                        setCurrentUser(null);
                                    }}
                                    className="ml-1 bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-xl text-xs font-extrabold shadow"
                                >
                                    🔒 Salir
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* ====================================================================
                        VISTA 1: MÓDULO DE MAPEO, EVALUACIÓN Y SECCIÓN BIOGRÁFICA IA
                    ==================================================================== */}
                    {activeMainTab === 'POSTULANTES' && (
                        <main className="max-w-7xl mx-auto p-4 space-y-4 animate-fade-in">
                            {/* Tarjetas KPI Filtrables */}
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                <div
                                    onClick={() => setFilterEstado('TODOS')}
                                    className={`p-3.5 rounded-2xl shadow-sm border cursor-pointer transition-all ${
                                        filterEstado === 'TODOS' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white border-slate-200 hover:border-[#59B447]'
                                    }`}
                                >
                                    <div className="text-[10px] font-extrabold uppercase opacity-75">📂 Total Candidatos</div>
                                    <div className="text-2xl font-black mt-0.5">{applicants.length}</div>
                                    <div className="text-[10px] font-bold text-[#59B447]">Base general activa</div>
                                </div>

                                <div
                                    onClick={() => setFilterEstado(filterEstado === 'Apto' ? 'TODOS' : 'Apto')}
                                    className={`p-3.5 rounded-2xl shadow-sm border cursor-pointer transition-all ${
                                        filterEstado === 'Apto' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white border-slate-200 hover:border-emerald-500'
                                    }`}
                                >
                                    <div className="text-[10px] font-extrabold uppercase opacity-80">✅ Postulantes Aptos</div>
                                    <div className="text-2xl font-black mt-0.5">{countAptos}</div>
                                    <div className={`text-[10px] font-bold ${filterEstado === 'Apto' ? 'text-emerald-100' : 'text-emerald-600'}`}>Listos para contrato</div>
                                </div>

                                <div
                                    onClick={() => setFilterEstado(filterEstado === 'Programado para Entrevista' ? 'TODOS' : 'Programado para Entrevista')}
                                    className={`p-3.5 rounded-2xl shadow-sm border cursor-pointer transition-all ${
                                        filterEstado === 'Programado para Entrevista' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-slate-200 hover:border-blue-500'
                                    }`}
                                >
                                    <div className="text-[10px] font-extrabold uppercase opacity-80">📅 Para Entrevista</div>
                                    <div className="text-2xl font-black mt-0.5">{countEntrevista}</div>
                                    <div className={`text-[10px] font-bold ${filterEstado === 'Programado para Entrevista' ? 'text-blue-100' : 'text-blue-600'}`}>Citados por Gerencia</div>
                                </div>

                                <div
                                    onClick={() => setFilterEstado(filterEstado === 'No Apto' ? 'TODOS' : 'No Apto')}
                                    className={`p-3.5 rounded-2xl shadow-sm border cursor-pointer transition-all ${
                                        filterEstado === 'No Apto' ? 'bg-red-600 text-white border-red-600' : 'bg-white border-slate-200 hover:border-red-500'
                                    }`}
                                >
                                    <div className="text-[10px] font-extrabold uppercase opacity-80">❌ No Aptos</div>
                                    <div className="text-2xl font-black mt-0.5">{countNoAptos}</div>
                                    <div className={`text-[10px] font-bold ${filterEstado === 'No Apto' ? 'text-red-100' : 'text-red-600'}`}>Perfil descartado</div>
                                </div>

                                <div
                                    onClick={() => setFilterEstado(filterEstado === 'En Evaluación' ? 'TODOS' : 'En Evaluación')}
                                    className={`p-3.5 rounded-2xl shadow-sm border cursor-pointer transition-all ${
                                        filterEstado === 'En Evaluación' ? 'bg-amber-500 text-white border-amber-500' : 'bg-white border-slate-200 hover:border-amber-500'
                                    }`}
                                >
                                    <div className="text-[10px] font-extrabold uppercase opacity-80">⏳ En Evaluación</div>
                                    <div className="text-2xl font-black mt-0.5">{countEnEvaluacion}</div>
                                    <div className={`text-[10px] font-bold ${filterEstado === 'En Evaluación' ? 'text-amber-100' : 'text-amber-600'}`}>Pendientes calificar</div>
                                </div>
                            </div>

                            {/* Barra de Carpetas de Google Drive */}
                            <div className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-2">
                                <div className="flex flex-wrap items-center gap-1.5">
                                    <span className="text-xs font-black text-slate-600 mr-1">📂 Carpetas Drive:</span>
                                    <button
                                        onClick={() => setFilterCarpeta('TODAS')}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition-all ${
                                            filterCarpeta === 'TODAS' ? 'bg-[#59B447] text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                        }`}
                                    >
                                        Todas ({applicants.length})
                                    </button>
                                    {folders.map(f => {
                                        const count = applicants.filter(a => (a.carpetaNombre || 'General') === f.nombre).length;
                                        const isActive = filterCarpeta === f.nombre;
                                        return (
                                            <button
                                                key={f.id || f.nombre}
                                                onClick={() => setFilterCarpeta(isActive ? 'TODAS' : f.nombre)}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition-all ${
                                                    isActive ? 'bg-blue-600 text-white shadow' : 'bg-blue-50 text-blue-900 hover:bg-blue-100 border border-blue-200'
                                                }`}
                                            >
                                                <span>📁 {f.nombre}</span>
                                                <span className={`text-[10px] px-1.5 rounded-full ${isActive ? 'bg-white/25 text-white' : 'bg-blue-200/70 text-blue-900'}`}>
                                                    {count}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>

                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => setIsFolderModalOpen(true)}
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs shadow-sm"
                                    >
                                        ✏️ Editar / Crear Carpetas
                                    </button>
                                    <a
                                        href={CREDIBAN_VAULT.getMasterDriveUrl()}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="bg-slate-800 hover:bg-slate-900 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs shadow-sm"
                                    >
                                        ↗ Abrir Drive
                                    </a>
                                </div>
                            </div>

                            {/* Barra de Acciones y Filtros Multicriterio */}
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <button
                                            onClick={() => {
                                                setIsConfirmationStep(false);
                                                setSelectedFile(null);
                                                setIsUploadModalOpen(true);
                                            }}
                                            className="bg-[#59B447] hover:bg-[#4a9c3a] active:scale-95 text-white font-black px-4 py-2.5 rounded-xl text-xs shadow-md flex items-center gap-2"
                                        >
                                            <span>📤 Subir CV (PDF) con Lectura Automática</span>
                                        </button>
                                        <button
                                            onClick={() => openContractModalForPerson(null)}

                                                    </div>

                                                    <div>
                                                        <label className="text-[10px] font-extrabold text-slate-700 uppercase block mb-1">💼 Experiencia en Financieras</label>
                                                        <select
                                                            value={ficha.expFinanciera}
                                                            onChange={e => updateDetailField('expFinanciera', e.target.value)}
                                                            className="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs font-bold bg-white"
                                                        >
                                                            {OPCIONES_EXPERIENCIA.map(op => <option key={op} value={op}>{op}</option>)}
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Calificación, Estado y Guardado */}
                                            <div className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                                    {[
                                                        { key: 'exp', label: 'Experiencia / Campo' },
                                                        { key: 'act', label: 'Actitud / Trato' },
                                                        { key: 'tec', label: 'Capacidad / Entrevista' }
                                                    ].map(item => (
                                                        <div key={item.key} className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                                            <span className="text-[11px] font-bold text-slate-600 block mb-1">{item.label}</span>
                                                            <div className="flex items-center gap-1">
                                                                {[1, 2, 3, 4, 5].map(val => (
                                                                    <button
                                                                        key={val}
                                                                        type="button"
                                                                        onClick={() => {
                                                                            const nextRubros = { ...detailApplicant.notasRubros, [item.key]: val };
                                                                            const avg = Number((((Number(nextRubros.exp) || val) + (Number(nextRubros.act) || val) + (Number(nextRubros.tec) || val)) / 3).toFixed(1));
                                                                            setDetailApplicant({ ...detailApplicant, calificacion: avg, notasRubros: nextRubros });
                                                                        }}
                                                                        className={`flex-1 py-1 rounded-lg font-black text-xs ${
                                                                            (detailApplicant.notasRubros?.[item.key] || 0) >= val
                                                                                ? 'bg-amber-400 text-slate-900'
                                                                                : 'bg-white text-slate-400 border border-slate-200'
                                                                        }`}
                                                                    >
                                                                        {val}★
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                <div className="grid grid-cols-3 gap-2">
                                                    <select
                                                        value={detailApplicant.estado}
                                                        onChange={e => setDetailApplicant({ ...detailApplicant, estado: e.target.value })}
                                                        className="border-2 border-[#59B447] rounded-xl px-2.5 py-2 text-xs font-black bg-white"
                                                    >
                                                        {ESTADOS_CANDIDATO.map(est => <option key={est} value={est}>{est}</option>)}
                                                    </select>
                                                    <select
                                                        value={detailApplicant.sede}
                                                        onChange={e => setDetailApplicant({ ...detailApplicant, sede: e.target.value })}
                                                        className="border border-slate-300 rounded-xl px-2.5 py-2 text-xs font-bold bg-slate-50"
                                                    >
                                                        {SEDES_OFICIALES.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                    <select
                                                        value={detailApplicant.carpetaNombre || 'General'}
                                                        onChange={e => setDetailApplicant({ ...detailApplicant, carpetaNombre: e.target.value })}
                                                        className="border border-blue-300 rounded-xl px-2.5 py-2 text-xs font-bold bg-blue-50 text-blue-900"
                                                    >
                                                        {folders.map(f => <option key={f.id || f.nombre} value={f.nombre}>📁 {f.nombre}</option>)}
                                                    </select>
                                                </div>

                                                <textarea
                                                    rows="2"
                                                    value={newCommentText}
                                                    onChange={e => setNewCommentText(e.target.value)}
                                                    placeholder={detailApplicant.comentarioActual || "Añadir observación o dictamen de entrevista..."}
                                                    className="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-semibold outline-none focus:ring-2 focus:ring-[#59B447]"
                                                />

                                                <button
                                                    type="button"
                                                    disabled={isSaving}
                                                    onClick={() => handleUpdateApplicantQuick(detailApplicant, newCommentText.trim())}
                                                    className="w-full bg-[#59B447] hover:bg-[#4a9c3a] text-white font-black py-3 rounded-2xl text-xs uppercase tracking-wider shadow-lg disabled:opacity-50"
                                                >
                                                    {isSaving ? '⏳ Guardando Cambios...' : `💾 Guardar Ficha, Biografía IA y Calificación (${currentUser.usuario})`}
                                                </button>
                                            </div>
                                        </div>

                                        {/* COLUMNA DERECHA (5 cols): VISOR DEL CV Y DEL CONTRATO ESCANEADO */}
                                        <div className="lg:col-span-5 flex flex-col justify-between space-y-4">
                                            <div className="bg-slate-100 rounded-2xl p-3 border border-slate-200 flex-1 flex flex-col min-h-[320px]">
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs font-black text-slate-700 uppercase">📄 Documento CV / Contrato</span>
                                                    <div className="flex gap-1.5">
                                                        {detailApplicant.urlCvPreview && (
                                                            <a
                                                                href={detailApplicant.urlCvDownload || detailApplicant.urlCvPreview}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                className="bg-slate-800 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg"
                                                            >
                                                                ↗ Abrir CV
                                                            </a>
                                                        )}
                                                        {contrato.urlContratoPreview && (
                                                            <a
                                                                href={contrato.urlContratoDownload || contrato.urlContratoPreview}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                className="bg-indigo-700 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg"
                                                            >
                                                                📜 Abrir Contrato PDF
                                                            </a>
                                                        )}
                                                    </div>
                                                </div>

                                                {(detailApplicant.urlCvPreview || contrato.urlContratoPreview) ? (
                                                    <iframe
                                                        src={detailApplicant.urlCvPreview || contrato.urlContratoPreview}
                                                        className="w-full flex-1 min-h-[260px] rounded-xl border bg-white"
                                                        title="Visor Documento"
                                                    />
                                                ) : (
                                                    <div className="flex-1 flex flex-col items-center justify-center text-center p-6 text-slate-400">
                                                        <div className="text-4xl mb-2">📄</div>
                                                        <div className="text-xs font-bold">Sin archivo PDF vinculado.</div>
                                                    </div>
                                                )}

                                                <div className="mt-2 pt-2 border-t border-slate-200">
                                                    <label className="text-[11px] font-bold text-slate-600 block mb-1">🔄 Actualizar CV (PDF/Imagen):</label>
                                                    <input
                                                        type="file"
                                                        accept=".pdf,image/*"
                                                        onChange={e => setReplaceCvFile(e.target.files[0] || null)}
                                                        className="w-full text-xs bg-white p-1.5 rounded-lg border border-slate-300"
                                                    />
                                                </div>
                                            </div>

                                            {/* Bitácora de Evaluaciones */}
                                            <div className="bg-slate-50 rounded-2xl p-3.5 border border-slate-200">
                                                <div className="text-[11px] font-black text-slate-600 uppercase mb-2">
                                                    🕒 Bitácora de Evaluaciones y Contratos ({detailApplicant.historial?.length || 0})
                                                </div>
                                                <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                                                    {Array.isArray(detailApplicant.historial) && detailApplicant.historial.length > 0 ? (
                                                        detailApplicant.historial.map((h, i) => (
                                                            <div key={i} className="bg-white border border-slate-200 rounded-xl p-2.5 text-xs">
                                                                <div className="flex justify-between font-bold text-[10px] text-slate-700">
                                                                    <span>👔 {h.gerente} ({h.sede})</span>
                                                                    <span>{h.estado} • ⭐ {h.nota} • {h.fecha}</span>
                                                                </div>
                                                                <div className="text-slate-600 mt-1 italic">"{h.comentario}"</div>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        <div className="text-xs text-slate-400 italic">Sin registros previos.</div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ========================================================================
                        MODAL 4: GESTOR DE CARPETAS DE GOOGLE DRIVE
                    ======================================================================== */}
                    {isFolderModalOpen && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 border-t-8 border-blue-600 shadow-2xl">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h3 className="text-base font-black text-slate-800">📁 Gestor de Carpetas de Google Drive</h3>
                                        <p className="text-[11px] text-slate-500 font-semibold">
                                            Carpeta Maestra: <a href={CREDIBAN_VAULT.getMasterDriveUrl()} target="_blank" rel="noopener noreferrer" className="text-blue-600 underline font-bold">Abrir Carpeta Raíz ↗</a>
                                        </p>
                                    </div>
                                    <button onClick={() => setIsFolderModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-black text-sm">✕</button>
                                </div>

                                <div className="bg-blue-50/70 border border-blue-200 rounded-2xl p-3.5 space-y-2">
                                    <label className="text-xs font-extrabold text-blue-950 block">➕ Crear Nueva Subcarpeta en Drive</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={newFolderName}
                                            onChange={e => setNewFolderName(e.target.value)}
                                            placeholder="Ej: Contratos 2026, Convocatoria Huaraz..."
                                            className="flex-1 border border-blue-300 rounded-xl px-3 py-2 text-xs font-bold bg-white outline-none"
                                        />
                                        <button
                                            type="button"
                                            disabled={isFolderBusy || !newFolderName.trim()}
                                            onClick={() => handleCreateFolder(newFolderName)}
                                            className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow disabled:opacity-50"
                                        >
                                            {isFolderBusy ? 'Creando...' : 'Crear Carpeta'}
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                                    {folders.map(f => {
                                        const isEditing = editingFolderKey === f.nombre;
                                        const count = applicants.filter(a => (a.carpetaNombre || 'General') === f.nombre).length;
                                        return (
                                            <div key={f.id || f.nombre} className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-2xl p-2.5">
                                                {isEditing ? (
                                                    <div className="flex-1 flex items-center gap-2">
                                                        <input
                                                            type="text"
                                                            value={editingFolderValue}
                                                            onChange={e => setEditingFolderValue(e.target.value)}
                                                            className="flex-1 border border-blue-400 rounded-xl px-2.5 py-1.5 text-xs font-bold bg-white"
                                                            autoFocus
                                                        />
                                                        <button
                                                            type="button"
                                                            disabled={isFolderBusy}
                                                            onClick={() => handleRenameFolder(f)}
                                                            className="bg-emerald-600 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs"
                                                        >
                                                            💾 Guardar
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setEditingFolderKey(null)}
                                                            className="text-xs font-bold text-slate-400 px-2"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <div>
                                                            <div className="text-xs font-black text-slate-800">📁 {f.nombre}</div>
                                                            <div className="text-[10px] font-bold text-slate-400">{count} registros</div>
                                                        </div>
                                                        <div className="flex items-center gap-1.5">
                                                            <button
                                                                type="button"
                                                                onClick={() => { setEditingFolderKey(f.nombre); setEditingFolderValue(f.nombre); }}
                                                                className="bg-white border border-slate-200 text-slate-700 font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                ✏️ Editar Nombre
                                                            </button>
                                                            <a
                                                                href={f.url || CREDIBAN_VAULT.getMasterDriveUrl()}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                className="bg-slate-800 text-white font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                ↗ Drive
                                                            </a>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
