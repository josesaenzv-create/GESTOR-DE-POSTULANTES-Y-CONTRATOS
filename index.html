                    setContractTargetPerson(personObj);
                    setContractPersonId(personObj.id);
                    setContractNombre(personObj.nombre || '');
                    setContractDni(personObj.dni || '');
                    setContractCelular(personObj.celular || '');
                    setContractResidencia(ficha.residencia || '');
                    setContractPuesto(personObj.puesto || 'Asesor');
                    setContractSede(personObj.sede || agencias[0] || 'HUACHO');
                    setContractSueldo(c.sueldo || '1300');
                    setContractMovilidadMonto(c.movilidadMonto || '');
                    const pLabel = c.plazoLabel || '3 Meses';
                    setContractPlazoLabel(pLabel);
                    const foundMonths = PLAZOS_CONTRATO.find(p => p.label === pLabel)?.months || 3;

                    if (mode === 'RENOVAR_BASE') {
                        // Usar el contrato que está por vencer como base para generar el nuevo contrato
                        setContractTipo('Adenda de Renovación de Contrato');
                        const nextStartIso = c.fechaFin ? addDaysToDateString(c.fechaFin, 1) : todayIso;
                        const nextEndIso = foundMonths > 0 ? addMonthsToDateString(nextStartIso, foundMonths) : "";
                        setContractFechaFirma(todayIso);
                        setContractFechaInicio(nextStartIso);
                        setContractFechaFin(nextEndIso);
                        setContractObservacion(`Renovación generada tomando como base el contrato anterior (${formatDateDisplay(c.fechaInicio)} al ${formatDateDisplay(c.fechaFin)}).`);
                        setContractAutoFilledBanner(`⚡ Modo Renovación Base Activo: Se cargaron los datos del contrato anterior de ${personObj.nombre} y se proyectó el nuevo período automáticamente.`);
                    } else {
                        setContractTipo(c.tipoContrato || 'Plazo Fijo / Sujeto a Modalidad');

                        setContractFechaFirma(c.fechaFirma || fIni);

                        setContractFechaFin(c.fechaFin || addMonthsToDateString(fIni, foundMonths));

                    setContractDni('');
                    setContractCelular('');
                    setContractResidencia('');
                    setContractPuesto('Asesor');

                    setContractTipo('Plazo Fijo / Sujeto a Modalidad');
                    setContractSueldo('1300');
                    setContractMovilidadMonto('');
                    setContractPlazoLabel('3 Meses');
                    setContractFechaFirma(todayIso);
                    setContractFechaInicio(todayIso);
                    setContractFechaFin(addMonthsToDateString(todayIso, 3));
                    setContractObservacion('');

                setIsContractModalOpen(true);

            // Autollenar todos los campos del contrato al subir un archivo Word (.docx/.doc) o PDF
            const handleContractFileAutoAnalyze = async (e) => {
                const file = e.target.files[0];

                    alert("⚠️ El documento supera los 15 MB.");
                    return;

                setContractDocFile(file);
                setIsAnalyzingContractDoc(true);

                try {
                    const ext = await extractCandidateOrContractData(file, agencias);
                    if (ext.nombre && (!contractNombre || contractPersonId === 'NUEVO')) setContractNombre(ext.nombre);
                    if (ext.dni && (!contractDni || contractPersonId === 'NUEVO')) setContractDni(ext.dni);
                    if (ext.celular && (!contractCelular || contractPersonId === 'NUEVO')) setContractCelular(ext.celular);
                    if (ext.residencia && !contractResidencia) setContractResidencia(ext.residencia);
                    if (ext.puestoSugerido) setContractPuesto(ext.puestoSugerido);
                    if (ext.sedeSugerida && agencias.includes(ext.sedeSugerida)) setContractSede(ext.sedeSugerida);

                    if (ext.plazoLabelExtraido) setContractPlazoLabel(ext.plazoLabelExtraido);

                    if (ext.fechaInicioExtraida) setContractFechaInicio(ext.fechaInicioExtraida);
                    if (ext.fechaFinExtraida) setContractFechaFin(ext.fechaFinExtraida);

                    setIsAnalyzingContractDoc(false);

            const handleSaveContractAndUploadDoc = async (e) => {

                    let fileMimeType = "";

                        fileMimeType = contractDocFile.type || (extDot.toLowerCase() === '.docx' ? "application/vnd.openxmlformats-officedocument.wordprocessingml.document" : extDot.toLowerCase() === '.doc' ? "application/msword" : "application/pdf");
                        uploadedPreview = fileBase64;
                        uploadedDownload = fileBase64;

                        const contractUploadResp = await syncApplicantToServer({
                            id: uploadMarkerId,
                            fechaRegistro: fechaStr,
                            dni: contractDni.trim(),
                            nombre: `CONTRATO_${contractNombre.trim().toUpperCase()}`,
                            celular: contractCelular.trim(),
                            puesto: contractPuesto,

                        });

                        if (contractUploadResp && contractUploadResp.status === 'ok') {

                            uploadedPreview = contractUploadResp.urlCvPreview || uploadedPreview;
                            uploadedDownload = contractUploadResp.urlCvDownload || uploadedDownload;
                            try {

                                    method: 'POST',
                                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify({ action: 'deleteApplicant', id: uploadMarkerId })
                                });
                            } catch (eDel) {}
                        }
                    }

                    let basePerson = contractTargetPerson || applicants.find(a => String(a.id) === String(contractPersonId));

                    const finalPreviewUrl = uploadedPreview || prevContrato.urlContratoPreview || "";
                    const finalDownloadUrl = uploadedDownload || prevContrato.urlContratoDownload || "";
                    const finalDriveContratoId = uploadedDriveId || prevContrato.driveContratoId || "";
                    const finalFileName = fileName || prevContrato.nombreArchivoContrato || "";

                    const nuevoItemHistorialContrato = {

                    };

            const handleCreateFolder = async (folderNameInput) => {
                const cleanName = String(folderNameInput || '').trim();
                if (!cleanName) return null;
                if (folders.some(f => f.nombre.toLowerCase() === cleanName.toLowerCase())) return cleanName;

                setIsFolderBusy(true);
                try {
                    const res = await fetch(dataServerUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'createFolder', nombre: cleanName })
                    });
                    const data = await res.json();
                    if (data.status === 'ok' && Array.isArray(data.carpetas)) {
                        setFolders(data.carpetas);
                    } else {
                        setFolders(prev => [...prev, { id: "local-" + Date.now(), nombre: cleanName, url: CREDIBAN_VAULT.getMasterDriveUrl() }]);
                    }
                    setNewFolderName('');
                    return cleanName;
                } catch (e) {
                    setFolders(prev => [...prev, { id: "local-" + Date.now(), nombre: cleanName, url: CREDIBAN_VAULT.getMasterDriveUrl() }]);
                    setNewFolderName('');
                    return cleanName;
                } finally {
                    setIsFolderBusy(false);
                }

                    return;

                    const oldName = folderObj.nombre;
                    const res = await fetch(dataServerUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'renameFolder',
                            folderId: folderObj.id && !String(folderObj.id).startsWith('f-') && !String(folderObj.id).startsWith('local-') ? folderObj.id : '',
                            oldName,
                            newName: cleanNewName

                        setFolders(data.carpetas);
                    } else {
                        setFolders(prev => prev.map(f => f.nombre === oldName ? { ...f, nombre: cleanNewName } : f));

                                                </div>
                                            </div>

                                            <div className="bg-slate-50 rounded-2xl p-3.5 border border-slate-200">
                                                <div className="text-[11px] font-black text-slate-600 uppercase mb-2">
                                                    🕒 Bitácora de Evaluaciones y Contratos ({detailApplicant.historial?.length || 0})
                                                </div>
                                                <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                                                    {Array.isArray(detailApplicant.historial) && detailApplicant.historial.length > 0 ? (
                                                        detailApplicant.historial.map((h, i) => (
                                                            <div key={i} className="bg-white border border-slate-200 rounded-xl p-2.5 text-xs">
                                                                <div className="flex justify-between font-bold text-[10px] text-slate-700">
                                                                    <span>👔 {h.gerente} ({h.sede})</span>
                                                                    <span>{h.estado} • ⭐ {h.nota} • {h.fecha}</span>
                                                                </div>
                                                                <div className="text-slate-600 mt-1 italic">"{h.comentario}"</div>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        <div className="text-xs text-slate-400 italic">Sin registros previos.</div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ========================================================================
                        MODAL 4: GESTOR GLOBAL DE AGENCIAS (SINCRONIZADO EN TODOS LOS DISPOSITIVOS)
                    ======================================================================== */}
                    {isAgencyModalOpen && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 border-t-8 border-[#59B447] shadow-2xl">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h3 className="text-base font-black text-slate-800">🏢 Gestor Global de Agencias CREDIBAN</h3>
                                        <p className="text-[11px] text-slate-500 font-semibold">
                                            ☁️ Cualquier agencia añadida o editada aquí se sincroniza en el Servidor para todos los celulares y PCs.
                                        </p>
                                    </div>
                                    <button onClick={() => setIsAgencyModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-black text-sm">✕</button>
                                </div>

                                <div className="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-3.5 space-y-2">
                                    <label className="text-xs font-extrabold text-emerald-950 block">➕ Añadir Nueva Agencia / Sede</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={newAgencyName}
                                            onChange={e => setNewAgencyName(e.target.value.toUpperCase())}
                                            placeholder="Ej: HUANUCO, BARRANCA, CHIMBOTE..."
                                            className="flex-1 border border-emerald-300 rounded-xl px-3 py-2 text-xs font-black uppercase bg-white outline-none"
                                        />
                                        <button
                                            type="button"
                                            disabled={isAgencySyncing || !newAgencyName.trim()}
                                            onClick={handleAddAgency}
                                            className="bg-[#59B447] hover:bg-[#4a9c3a] text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow disabled:opacity-50"
                                        >
                                            {isAgencySyncing ? 'Sincronizando...' : 'Añadir Agencia'}
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                                    {agencias.map(ag => {
                                        const isEditing = editingAgencyOld === ag;
                                        const count = applicants.filter(a => a.sede === ag).length;
                                        return (
                                            <div key={ag} className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-2xl p-2.5">
                                                {isEditing ? (
                                                    <div className="flex-1 flex items-center gap-2">
                                                        <input
                                                            type="text"
                                                            value={editingAgencyNew}
                                                            onChange={e => setEditingAgencyNew(e.target.value.toUpperCase())}
                                                            className="flex-1 border border-emerald-500 rounded-xl px-2.5 py-1.5 text-xs font-black uppercase bg-white"
                                                            autoFocus
                                                        />
                                                        <button
                                                            type="button"
                                                            disabled={isAgencySyncing}
                                                            onClick={() => handleRenameAgency(ag)}
                                                            className="bg-emerald-600 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs"
                                                        >
                                                            💾 Guardar en Nube
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setEditingAgencyOld(null)}
                                                            className="text-xs font-bold text-slate-400 px-2"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <div>
                                                            <div className="text-xs font-black text-slate-800">🏢 Agencia {ag}</div>
                                                            <div className="text-[10px] font-bold text-slate-400">{count} registros vinculados</div>
                                                        </div>
                                                        <div className="flex items-center gap-1.5">
                                                            <button
                                                                type="button"
                                                                onClick={() => { setEditingAgencyOld(ag); setEditingAgencyNew(ag); }}
                                                                className="bg-white border border-slate-200 text-slate-700 font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                ✏️ Editar Nombre
                                                            </button>
                                                            <button
                                                                type="button"
                                                                onClick={() => handleDeleteAgency(ag)}
                                                                className="bg-red-50 border border-red-200 text-red-700 font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================================
                        MODAL 5: GESTOR DE CARPETAS DE ALMACENAMIENTO
                    ======================================================================== */}
                    {isFolderModalOpen && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 border-t-8 border-blue-600 shadow-2xl">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h3 className="text-base font-black text-slate-800">📁 Gestor de Carpetas del Servidor</h3>
                                        <p className="text-[11px] text-slate-500 font-semibold">
                                            Carpeta Maestra: <a href={CREDIBAN_VAULT.getMasterDriveUrl()} target="_blank" rel="noopener noreferrer" className="text-blue-600 underline font-bold">Abrir Carpeta Raíz ↗</a>
                                        </p>
                                    </div>
                                    <button onClick={() => setIsFolderModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-black text-sm">✕</button>
                                </div>

                                <div className="bg-blue-50/70 border border-blue-200 rounded-2xl p-3.5 space-y-2">
                                    <label className="text-xs font-extrabold text-blue-950 block">➕ Crear Nueva Subcarpeta</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={newFolderName}
                                            onChange={e => setNewFolderName(e.target.value)}
                                            placeholder="Ej: Contratos Huánuco 2026..."
                                            className="flex-1 border border-blue-300 rounded-xl px-3 py-2 text-xs font-bold bg-white outline-none"
                                        />
                                        <button
                                            type="button"
                                            disabled={isFolderBusy || !newFolderName.trim()}
                                            onClick={() => handleCreateFolder(newFolderName)}
                                            className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow disabled:opacity-50"
                                        >
                                            {isFolderBusy ? 'Creando...' : 'Crear Carpeta'}
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                                    {folders.map(f => {
                                        const isEditing = editingFolderKey === f.nombre;
                                        const count = applicants.filter(a => (a.carpetaNombre || 'General') === f.nombre).length;
                                        return (
                                            <div key={f.id || f.nombre} className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-2xl p-2.5">
                                                {isEditing ? (
                                                    <div className="flex-1 flex items-center gap-2">
                                                        <input
                                                            type="text"
                                                            value={editingFolderValue}
                                                            onChange={e => setEditingFolderValue(e.target.value)}
                                                            className="flex-1 border border-blue-400 rounded-xl px-2.5 py-1.5 text-xs font-bold bg-white"
                                                            autoFocus
                                                        />
                                                        <button
                                                            type="button"
                                                            disabled={isFolderBusy}
                                                            onClick={() => handleRenameFolder(f)}
                                                            className="bg-emerald-600 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs"
                                                        >
                                                            💾 Guardar
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setEditingFolderKey(null)}
                                                            className="text-xs font-bold text-slate-400 px-2"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <div>
                                                            <div className="text-xs font-black text-slate-800">📁 {f.nombre}</div>
                                                            <div className="text-[10px] font-bold text-slate-400">{count} registros</div>
                                                        </div>
                                                        <div className="flex items-center gap-1.5">
                                                            <button
                                                                type="button"
                                                                onClick={() => { setEditingFolderKey(f.nombre); setEditingFolderValue(f.nombre); }}
                                                                className="bg-white border border-slate-200 text-slate-700 font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                ✏️ Editar Nombre
                                                            </button>
                                                            <a
                                                                href={f.url || CREDIBAN_VAULT.getMasterDriveUrl()}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                className="bg-slate-800 text-white font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                ↗ Abrir
                                                            </a>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
