        // Convertir cualquier fecha ("DD/MM/YYYY" o "YYYY-MM-DD") a objeto Date o cadena "YYYY-MM-DD"
        const normalizeAnyDateToIso = (dateStr) => {
            if (!dateStr) return "";
            const s = String(dateStr).trim();
            if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
            const slash = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
            if (slash) {
                return `${slash[3]}-${String(slash[2]).padStart(2, '0')}-${String(slash[1]).padStart(2, '0')}`;
            }
            return "";
        };

        // Evaluador de Filtro por Periodos para Gerentes
        const matchesPeriodFilter = (rawDateStr, periodMode, selectedMonthYear, dateFrom, dateTo) => {
            if (!periodMode || periodMode === 'TODOS') return true;
            const iso = normalizeAnyDateToIso(rawDateStr);
            if (!iso) return false;

            const todayIso = new Date().toISOString().slice(0, 10);
            if (periodMode === 'HOY') {
                return iso === todayIso;
            }
            if (periodMode === 'ESTA_SEMANA') {
                const now = new Date();
                const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1; // Lunes = 0
                const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek);
                const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 6);
                const startIso = startOfWeek.toISOString().slice(0, 10);
                const endIso = endOfWeek.toISOString().slice(0, 10);
                return iso >= startIso && iso <= endIso;
            }
            if (periodMode === 'ESTE_MES') {
                return iso.slice(0, 7) === todayIso.slice(0, 7);
            }
            if (periodMode === 'MES_ESPECIFICO') {
                if (!selectedMonthYear) return true;
                return iso.slice(0, 7) === selectedMonthYear;
            }
            if (periodMode === 'RANGO') {
                if (dateFrom && iso < dateFrom) return false;
                if (dateTo && iso > dateTo) return false;
                return true;
            }
            return true;
        };

        const addMonthsToDateString = (yyyyMmDd, monthsToAdd) => {
            if (!yyyyMmDd || !monthsToAdd || Number(monthsToAdd) <= 0) return "";
            const parts = yyyyMmDd.split("-");
            if (parts.length !== 3) return "";
            const dt = new Date(Number(parts[0]), Number(parts[1]) - 1 + Number(monthsToAdd), Number(parts[2]));
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const addDaysToDateString = (yyyyMmDd, daysToAdd) => {
            if (!yyyyMmDd) return "";
            const parts = yyyyMmDd.split("-");
            if (parts.length !== 3) return "";
            const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]) + Number(daysToAdd));
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const formatDateDisplay = (yyyyMmDd) => {
            if (!yyyyMmDd) return "-";
            if (yyyyMmDd.includes("/")) return yyyyMmDd;
            const parts = yyyyMmDd.split("-");
            if (parts.length !== 3) return yyyyMmDd;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;

        const calculateDaysRemaining = (fechaFinYyyyMmDd, plazoLabel = "") => {
            if (String(plazoLabel).toLowerCase().includes("indeterminado")) return 9999;
            if (!fechaFinYyyyMmDd) return null;
            const parts = fechaFinYyyyMmDd.split("-");
            if (parts.length !== 3) return null;
            const end = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 23, 59, 59);
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
            const diffTime = end.getTime() - todayStart.getTime();
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

                return { code: 'VIGENTE', label: '⚪ Fecha fin pendiente', badgeCls: 'bg-slate-100 text-slate-700 border-slate-300', days: null };

        // ============================================================================
        // 5. MOTOR UNIVERSAL DE EXTRACCIÓN DE TEXTO + IA GEMINI ULTRA-RÁPIDA (BAJO TOKEN)
        // ============================================================================
        async function extractRawTextFromAnyFile(file) {
            if (!file) return { fullText: "", topLines: [] };
            const fileName = (file.name || "").toLowerCase();
            let fullText = "";
            let topLines = [];

            if (fileName.endsWith(".docx") || fileName.endsWith(".doc") || file.type.includes("word")) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    if (window.mammoth) {
                        const result = await window.mammoth.extractRawText({ arrayBuffer });
                        if (result && result.value) fullText = result.value;
                    }
                    if (!fullText || fullText.trim().length < 15) {
                        const decoder = new TextDecoder("iso-8859-1");
                        const rawStr = decoder.decode(arrayBuffer);
                        const readableBlocks = rawStr.match(/[A-Za-záéíóúñÁÉÍÓÚÑ0-9\s.,:;\/\-()°ºS$]{6,}/g);
                        if (readableBlocks) fullText = readableBlocks.join("\n");
                    }
                    topLines = fullText.split(/\r?\n/).map(l => l.trim()).filter(Boolean).slice(0, 22);
                } catch (err) {
                    console.warn("Aviso leyendo Word:", err);
                }
                return { fullText, topLines };
            }

            if ((file.type === "application/pdf" || fileName.endsWith(".pdf")) && window.pdfjsLib) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    const maxPages = Math.min(pdf.numPages, 3);

                    for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();

                        const lineBuckets = {};
                        textContent.items.forEach(item => {
                            const str = (item.str || "").trim();
                            if (!str) return;
                            const y = Math.round(item.transform[5] / 4) * 4;
                            if (!lineBuckets[y]) lineBuckets[y] = [];
                            lineBuckets[y].push({ x: item.transform[4], text: str });
                        });

                        const sortedYs = Object.keys(lineBuckets).map(Number).sort((a, b) => b - a);
                        const pageLines = sortedYs.map(y => {
                            const sortedItems = lineBuckets[y].sort((a, b) => a.x - b.x);
                            return sortedItems.map(i => i.text).join(" ").replace(/\s+/g, " ").trim();
                        }).filter(Boolean);

                        if (pageNum === 1) topLines = pageLines.slice(0, 20);
                        fullText += pageLines.join("\n") + "\n";
                    }
                } catch (err) {
                    console.warn("Aviso leyendo PDF:", err);
                }
            }

            return { fullText, topLines };
        }

        function parseSpanishDateToIso(rawDateStr) {
            if (!rawDateStr) return "";
            const s = String(rawDateStr).trim().toLowerCase();
            const slashMatch = s.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](20\d{2})\b/);
            if (slashMatch) {
                return `${slash[3]}-${String(slash[2]).padStart(2, '0')}-${String(slash[1]).padStart(2, '0')}`;
            }
            const isoMatch = s.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
            if (isoMatch) return isoMatch[0];

            const mesesMap = {
                enero: '01', febrero: '02', marzo: '03', abril: '04', mayo: '05', junio: '06',
                julio: '07', agosto: '08', septiembre: '09', setiembre: '09', octubre: '10', noviembre: '11', diciembre: '12'
            };
            const textMatch = s.match(/\b(\d{1,2})\s+de\s+([a-záéíóú]+)\s+(?:de|del)\s+(20\d{2})\b/i);
            if (textMatch) {
                const dd = String(textMatch[1]).padStart(2, '0');
                const mm = mesesMap[textMatch[2].toLowerCase()];
                const yyyy = textMatch[3];
                if (mm) return `${yyyy}-${mm}-${dd}`;
            }
            return "";
        }

        // Llamada Ultra-Rápida a Gemini Flash con Compresión Extrema de Tokens (< 350 tokens de entrada)
        async function callGeminiLowTokenExtractor(compressedSnippet, agenciasActivas) {
            const apiKey = CREDIBAN_VAULT.getAiKey();
            if (!apiKey || !compressedSnippet || compressedSnippet.length < 15) return null;

            // Recortar y limpiar espacios redundantes para usar la mínima cantidad de tokens posible
            const ultraCompactText = compressedSnippet.replace(/\s+/g, " ").trim().slice(0, 1600);
            const prompt = `Extrae JSON de este CV/Contrato Perú (Agencias:${agenciasActivas.join(",")}). Claves exactas:{"nombre":"APELLIDOS Y NOMBRES","dni":"8 digitos","celular":"9 digitos","residencia":"direccion/ciudad","sede":"agencia","puesto":"Asesor o Caja","sueldo":"numero","plazoLabel":"1 Mes|2 Meses|3 Meses|6 Meses|12 Meses (1 Año)|Indeterminado","fechaFirma":"YYYY-MM-DD","fechaInicio":"YYYY-MM-DD","fechaFin":"YYYY-MM-DD","regimen":"AFP Integra|AFP Prima|AFP Profuturo|AFP Habitat|ONP (Sistema Nacional - 13%)|Por definir / RxH","seguro":"EsSalud (9% Aporte Empleador)|SIS (Seguro Integral de Salud)|Por definir","asigFamiliar":boolean,"biografiaIA":"Resumen profesional en 2 lineas"}. Texto:${ultraCompactText}`;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3200); // Máximo 3.2 segundos para velocidad instantánea

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    signal: controller.signal,
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            temperature: 0.0,
                            maxOutputTokens: 240,
                            responseMimeType: "application/json"
                        }
                    })
                });
                clearTimeout(timeoutId);
                if (!res.ok) return null;
                const data = await res.json();
                const rawJson = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!rawJson) return null;
                return JSON.parse(rawJson);
            } catch (e) {
                clearTimeout(timeoutId);
                return null;
            }
        }

        // Analizador Híbrido: Heurística Local Instantánea (0ms) + Enriquecimiento con IA Gemini Flash
        async function extractCandidateOrContractData(file, agenciasActivas = DEFAULT_AGENCIAS) {
            const { fullText, topLines } = await extractRawTextFromAnyFile(file);

            const cleanFileName = (file ? file.name : "")
                .replace(/\.(pdf|docx|doc|jpg|jpeg|png)$/i, "")
                .replace(/^(cv|curriculum|vitae|hoja_de_vida|postulante|contrato|adenda|renovacion)[_\-\s]*/i, "")
                .replace(/[_\-]+/g, " ")
                .trim();

            // 1. DNI
            let dni = "";
            const textWithoutRuc = fullText.replace(/20613997360/g, "");
            const dniExplicit = textWithoutRuc.match(/(?:D\.?N\.?I\.?|DOCUMENTO\s+DE\s+IDENTIDAD|IDENTIFICAD[OA]\s+CON\s+DNI)\s*(?:N[°ºo.]?)?\s*[:#\-]?\s*([014678]\d{7})\b/i);
            if (dniExplicit) dni = dniExplicit[1];
            else {
                const all8Digits = textWithoutRuc.match(/\b([014678]\d{7})\b/g);
                if (all8Digits && all8Digits.length > 0) dni = all8Digits[0];
                else {
                    const fileDni = cleanFileName.match(/\b([014678]\d{7})\b/);
                    if (fileDni) dni = fileDni[1];
                }
            }

            // 2. CELULAR
            let celular = "";
            const phoneMatches = textWithoutRuc.match(/(?:\+?51[\s\-]?)?(9\d{2}[\s\-]?\d{3}[\s\-]?\d{3}|9\d{8})\b/g);
            if (phoneMatches && phoneMatches.length > 0) {
                for (let rawPhone of phoneMatches) {
                    const digits = rawPhone.replace(/\D/g, "");
                    const nineDigits = digits.length === 11 && digits.startsWith("51") ? digits.slice(2) : digits;
                    if (nineDigits.length === 9 && nineDigits.startsWith("9") && nineDigits !== dni) {
                        celular = nineDigits;
                        break;
                    }
                }
            }

            // 3. NOMBRE
            let nombre = "";
            const contractWorkerMatch = fullText.match(/(?:de\s+la\s+otra\s+parte\s+(?:Don\(ña\)|Don|Doña|el\s+Sr\.?|la\s+Sra\.?|Sr\(a\)\.?)\s*|EL\s+TRABAJADOR\s*[:\-]\s*)([A-ZÁÉÍÓÚÑ][A-Za-záéíóúñÁÉÍÓÚÑ\s]{5,50}?)(?=\s*,\s*identificad|\s+con\s+DNI|\s+identificad)/i);
            const cvNameExplicit = fullText.match(/(?:NOMBRES?\s+Y\s+APELLIDOS?|APELLIDOS?\s+Y\s+NOMBRES?|NOMBRE\s+COMPLETO|POSTULANTE|TRABAJADOR|COLABORADOR)\s*[:\-]\s*([A-ZÁÉÍÓÚÑ][A-Za-záéíóúñÁÉÍÓÚÑ\s,]{5,55})/i);

            if (contractWorkerMatch) {
                nombre = contractWorkerMatch[1].replace(/\s+/g, " ").trim().toUpperCase();
            } else if (cvNameExplicit) {
                nombre = cvNameExplicit[1].replace(/,/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
            } else {
                const bannedWords = /^(CURRICULUM|CURRÍCULUM|VITAE|HOJA DE VIDA|CONTRATO|ADENDA|CREDIBAN|RESUMEN|PERFIL|CONTACTO|DATOS PERSONALES|EXPERIENCIA|EDUCACIÓN|EDUCACION|FORMACIÓN|FORMACION|HABILIDADES|REFERENCIAS|OBJETIVO|SOBRE MI|SOBRE MÍ|ASESOR|CAJERO|CAJA|HUACHO|HUARAZ|ICA|HUANUCO|HUÁNUCO|LIMA|PERÚ|PERU|DIRECCIÓN|DIRECCION|TELÉFONO|TELEFONO|CELULAR|CORREO|EMAIL|PRIMERO|SEGUNDO|CLÁUSULA)/i;
                for (let line of topLines) {
                    const cleanLine = line.replace(/[^A-Za-záéíóúñÁÉÍÓÚÑ\s]/g, " ").replace(/\s+/g, " ").trim();
                    const words = cleanLine.split(" ").filter(w => w.length >= 2);
                    if (
                        words.length >= 2 &&
                        words.length <= 6 &&
                        cleanLine.length >= 7 &&
                        cleanLine.length <= 52 &&
                        !bannedWords.test(cleanLine) &&
                        !/\d/.test(line) &&
                        !line.includes("@")
                    ) {
                        nombre = cleanLine.toUpperCase();
                        break;
                    }
                }
            }
            if (!nombre && cleanFileName) {
                const fromFile = cleanFileName.replace(/\d+/g, "").replace(/\s+/g, " ").trim();
                if (fromFile.length >= 4) nombre = fromFile.toUpperCase();
            }

            // 4. LUGAR DE RESIDENCIA Y AGENCIA
            let residencia = "";
            const domContract = fullText.match(/domicilio\s+(?:real\s+)?en\s+([^,\n\r]{5,70})/i);
            const dirExplicit = fullText.match(/(?:DIRECCI[ÓO]N|DOMICILIO|LUGAR\s+DE\s+RESIDENCIA|RESIDENCIA|UBICACI[ÓO]N|DISTRITO)\s*[:\-]\s*([^\n\r]{4,75})/i);
            if (domContract) residencia = domContract[1].trim();
            else if (dirExplicit) residencia = dirExplicit[1].trim();
            else {
                const streetMatch = fullText.match(/\b((?:Av\.|Avenida|Jr\.|Jirón|Calle|Ca\.|Urb\.|Urbanización|Psje\.|Pasaje|Mz\.|Asoc\.|AA\.HH\.)\s+[^\n\r]{5,60})/i);
                if (streetMatch) residencia = streetMatch[1].trim();
            }

            const ciudadesPeru = [
                { pattern: /\b(HUACHO|HUALMAY|SANTA\s+MAR[IÍ]A|V[EÉ]GUETA|SAY[AÁ]N|HUAURA|BARRANCA)\b/i, ciudad: "Huacho", sede: "HUACHO" },
                { pattern: /\b(HUARAZ|INDEPENDENCIA\s*-\s*HUARAZ|CARHUAZ|YUNGAY|CARAZ|ANCASH|ÁNCASH)\b/i, ciudad: "Huaraz", sede: "HUARAZ" },
                { pattern: /\b(ICA|PARCONA|LA\s+TINGUI[ÑN]A|SUBTANJALLA|CHINCHA|PISCO|NAZCA)\b/i, ciudad: "Ica", sede: "ICA" },
                { pattern: /\b(HU[AÁ]NUCO|AMARILIS|PILLCO\s+MARCA|TINGO\s+MAR[IÍ]A|AMBO)\b/i, ciudad: "Huánuco", sede: "HUANUCO" },
                { pattern: /\b(LIMA|SAN\s+JUAN|ATE|COMAS|LOS\s+OLIVOS|CALLAO|SMP|CHORRILLOS|MIRAFLORES|SURCO)\b/i, ciudad: "Lima", sede: "LIMA" }
            ];

            let sedeSugerida = "";
            for (let item of ciudadesPeru) {
                const m = fullText.match(item.pattern);
                if (m) {
                    sedeSugerida = item.sede;
                    if (!residencia) residencia = `${m[1].toUpperCase()} (${item.ciudad})`;
                    break;
                }
            }
            if (!sedeSugerida && Array.isArray(agenciasActivas)) {
                for (let ag of agenciasActivas) {
                    if (fullText.toUpperCase().includes(ag.toUpperCase())) {
                        sedeSugerida = ag.toUpperCase();
                        break;
                    }
                }
            }

            // 5. PUESTO, ESTUDIOS, AFP/ONP, SEGURO Y ASIGNACIÓN FAMILIAR
            let puestoSugerido = "Asesor";
            if (/\b(CAJERO|CAJERA|VENTANILLA|GESTOR[A]?\s+DE\s+CAJA|CAJA\s+Y\s+OPERACIONES|CUADRE\s+DE\s+CAJA)\b/i.test(fullText)) {
                puestoSugerido = "Caja";
            }

            let estudiosSugeridos = "Por confirmar documentos";
            if (/\b(UNIVERSITARIO|UNIVERSIDAD|LICENCIAD[OA]|INGENIER[OA]|CONTADOR|ECONOMISTA)\b/i.test(fullText)) {
                estudiosSugeridos = /\b(TITULAD[OA]|BACHILLER|COLEGIAD[OA])\b/i.test(fullText)
                    ? "Universitario Confirmado (Titulado / Bachiller)"
                    : "Universitario En Curso / Egresado";
            } else if (/\b(INSTITUTO|T[EÉ]CNICO|T[EÉ]CNICA)\b/i.test(fullText)) {
                estudiosSugeridos = "Técnico Confirmado (Titulado / Egresado)";
            } else if (/\b(SECUNDARIA\s+COMPLETA)\b/i.test(fullText)) {
                estudiosSugeridos = "Secundaria Completa Confirmada";
            }

            let regimenSugerido = "Por definir / RxH";
            if (/\bAFP\s*INTEGRA\b/i.test(fullText)) regimenSugerido = "AFP Integra";
            else if (/\bAFP\s*PRIMA\b/i.test(fullText)) regimenSugerido = "AFP Prima";
            else if (/\bAFP\s*PROFUTURO\b/i.test(fullText)) regimenSugerido = "AFP Profuturo";
            else if (/\bAFP\s*HABITAT\b/i.test(fullText)) regimenSugerido = "AFP Habitat";
            else if (/\bONP\b/i.test(fullText)) regimenSugerido = "ONP (Sistema Nacional - 13%)";

            let seguroSugerido = "Por definir";
            if (/\bESSALUD\b/i.test(fullText)) seguroSugerido = "EsSalud (9% Aporte Empleador)";
            else if (/\bSIS\b/i.test(fullText)) seguroSugerido = "SIS (Seguro Integral de Salud)";
            else if (/\bEPS\b/i.test(fullText)) seguroSugerido = "EPS / Seguro Privado";

            let asigFamiliarSugerida = "No aplica (S/ 0.00)";
            let montoAsigExtraido = 0;
            if (/\bASIGNACI[ÓO]N\s+FAMILIAR\b/i.test(fullText)) {
                asigFamiliarSugerida = "Sí aplica (10% RMV Legal)";
                const afMontoMatch = fullText.match(/Asignaci[óo]n\s+Familiar[^S\d]{1,35}(?:S\/\.?)?\s*(\d{2,3}(?:\.\d{2})?)/i);
                montoAsigExtraido = afMontoMatch ? Number(afMontoMatch[1]) : 113;
            }

            // 6. EXTRAER DATOS DE CONTRATO (SUELDO, PLAZO, FECHAS)
            let sueldoExtraido = "";
            const sueldoMatch = fullText.match(/(?:remuneraci[óo]n|sueldo|honorarios?|contraprestaci[óo]n|b[áa]sico)[^S\d]{1,45}(?:S\/\.?|Soles)?\s*(\d{1,2}[,\.]?\d{3}(?:\.\d{2})?|\d{3,4}(?:\.\d{2})?)/i);
            if (sueldoMatch) {
                sueldoExtraido = sueldoMatch[1].replace(/,/g, "").split(".")[0];
            } else {
                const anySoles = fullText.match(/S\/\.?\s*(\d{1,2}[,\.]?\d{3}|\d{3,4})(?:\.\d{2})?\b/i);
                if (anySoles) sueldoExtraido = anySoles[1].replace(/,/g, "");
            }

            let plazoLabelExtraido = "3 Meses";
            let plazoMesesNum = 3;
            if (/\b(indeterminado|indefinido)\b/i.test(fullText)) {
                plazoLabelExtraido = "Indeterminado";
                plazoMesesNum = 0;
            } else if (/\b(doce\s*\(?12\)?\s*meses|12\s*meses|un\s*\(?1\)?\s*a[ñn]o|1\s*a[ñn]o)\b/i.test(fullText)) {
                plazoLabelExtraido = "12 Meses (1 Año)";
                plazoMesesNum = 12;
            } else if (/\b(seis\s*\(?6\)?\s*meses|6\s*meses|06\s*meses)\b/i.test(fullText)) {
                plazoLabelExtraido = "6 Meses";
                plazoMesesNum = 6;
            } else if (/\b(tres\s*\(?3\)?\s*meses|3\s*meses|03\s*meses)\b/i.test(fullText)) {
                plazoLabelExtraido = "3 Meses";
                plazoMesesNum = 3;
            } else if (/\b(dos\s*\(?2\)?\s*meses|2\s*meses|02\s*meses)\b/i.test(fullText)) {
                plazoLabelExtraido = "2 Meses";
                plazoMesesNum = 2;
            } else if (/\b(un\s*\(?1\)?\s*mes|1\s*mes|01\s*mes)\b/i.test(fullText)) {
                plazoLabelExtraido = "1 Mes";
                plazoMesesNum = 1;
            }

            const dateRegexGlobal = /\b(\d{1,2}\s+de\s+[a-záéíóú]+\s+(?:de|del)\s+20\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}|20\d{2}-\d{2}-\d{2})\b/gi;
            const foundDatesRaw = fullText.match(dateRegexGlobal) || [];
            const foundDatesIso = foundDatesRaw.map(parseSpanishDateToIso).filter(Boolean);

            let fechaInicioExtraida = "";
            let fechaFinExtraida = "";
            let fechaFirmaExtraida = "";

            const inicioExplicit = fullText.match(/(?:iniciando|inicia|a\s+partir\s+del?|desde\s+el|vigencia\s+el(?:\s+d[íi]a)?)\s+(\d{1,2}\s+de\s+[a-záéíóú]+\s+(?:de|del)\s+20\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}|20\d{2}-\d{2}-\d{2})/i);
            const finExplicit = fullText.match(/(?:concluyendo|concluye|vence|vencimiento|hasta\s+el|finaliza(?:ndo)?\s+el(?:\s+d[íi]a)?)\s+(\d{1,2}\s+de\s+[a-záéíóú]+\s+(?:de|del)\s+20\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}|20\d{2}-\d{2}-\d{2})/i);
            const firmaExplicit = fullText.match(/(?:con\s+fecha|suscriben[^.\n]{1,40}el|firmado[^.\n]{1,40}el|a\s+los)\s+(\d{1,2}\s+de\s+[a-záéíóú]+\s+(?:de|del)\s+20\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}|20\d{2}-\d{2}-\d{2})/i);

            if (inicioExplicit) fechaInicioExtraida = parseSpanishDateToIso(inicioExplicit[1]);
            if (finExplicit) fechaFinExtraida = parseSpanishDateToIso(finExplicit[1]);
            if (firmaExplicit) fechaFirmaExtraida = parseSpanishDateToIso(firmaExplicit[1]);

            if (!fechaInicioExtraida && foundDatesIso.length >= 1) fechaInicioExtraida = foundDatesIso[0];
            if (!fechaFinExtraida && foundDatesIso.length >= 2) fechaFinExtraida = foundDatesIso[1];
            if (!fechaFirmaExtraida) {
                fechaFirmaExtraida = foundDatesIso.length >= 3 ? foundDatesIso[foundDatesIso.length - 1] : (fechaInicioExtraida || new Date().toISOString().slice(0, 10));
            }
            if (fechaInicioExtraida && !fechaFinExtraida && plazoMesesNum > 0) {
                fechaFinExtraida = addMonthsToDateString(fechaInicioExtraida, plazoMesesNum);
            }

            // Generar síntesis biográfica automática base
            let biografiaAuto = "";
            if (fullText.length > 30) {
                const expMatch = fullText.match(/(?:experiencia|laboral|funciones|perfil)[^]{10,220}/i);
                const snippet = expMatch ? expMatch[0].replace(/\s+/g, " ").trim() : topLines.slice(1, 5).join(" • ");
                biografiaAuto = `Perfil analizado automáticamente: Postulante a ${puestoSugerido} (${estudiosSugeridos}). ${snippet.slice(0, 180)}...`;
            }

            // 7. ENRIQUECIMIENTO ULTRA-RÁPIDO CON IA GEMINI (SI HAY TEXTO, USA <350 TOKENS)
            let aiUsed = false;
            if (fullText.length > 20) {
                const aiResult = await callGeminiLowTokenExtractor(fullText, agenciasActivas);
                if (aiResult && typeof aiResult === 'object') {
                    aiUsed = true;
                    if (aiResult.nombre && String(aiResult.nombre).length >= 5) nombre = String(aiResult.nombre).toUpperCase().trim();
                    if (aiResult.dni && /^\d{8}$/.test(String(aiResult.dni).trim())) dni = String(aiResult.dni).trim();
                    if (aiResult.celular && /^9\d{8}$/.test(String(aiResult.celular).replace(/\D/g, ""))) celular = String(aiResult.celular).replace(/\D/g, "");
                    if (aiResult.residencia && String(aiResult.residencia).length >= 3) residencia = String(aiResult.residencia).trim();
                    if (aiResult.sede && agenciasActivas.includes(String(aiResult.sede).toUpperCase())) sedeSugerida = String(aiResult.sede).toUpperCase();
                    if (aiResult.puesto === "Caja" || aiResult.puesto === "Asesor") puestoSugerido = aiResult.puesto;
                    if (aiResult.sueldo && Number(aiResult.sueldo) >= 500) sueldoExtraido = String(Math.round(Number(aiResult.sueldo)));
                    if (aiResult.fechaInicio && /^\d{4}-\d{2}-\d{2}$/.test(aiResult.fechaInicio)) fechaInicioExtraida = aiResult.fechaInicio;
                    if (aiResult.fechaFin && /^\d{4}-\d{2}-\d{2}$/.test(aiResult.fechaFin)) fechaFinExtraida = aiResult.fechaFin;
                    if (aiResult.fechaFirma && /^\d{4}-\d{2}-\d{2}$/.test(aiResult.fechaFirma)) fechaFirmaExtraida = aiResult.fechaFirma;
                    if (aiResult.biografiaIA) biografiaAuto = String(aiResult.biografiaIA).trim();
                }
            }

            return {
                nombre: nombre || "",
                dni: dni || "",
                celular: celular || "",
                residencia: residencia || "",
                sedeSugerida: sedeSugerida || "",
                puestoSugerido,
                estudiosSugeridos,
                regimenSugerido,
                seguroSugerido,
                asigFamiliarSugerida,
                montoAsigExtraido: montoAsigExtraido || 0,
                sueldoExtraido: sueldoExtraido || "1300",
                plazoLabelExtraido,
                fechaFirmaExtraida: fechaFirmaExtraida || new Date().toISOString().slice(0, 10),
                fechaInicioExtraida: fechaInicioExtraida || new Date().toISOString().slice(0, 10),
                fechaFinExtraida: fechaFinExtraida || addMonthsToDateString(new Date().toISOString().slice(0, 10), plazoMesesNum || 3),
                biografiaAuto,
                aiUsed,
                textoExtraido: fullText.length > 15
            };
        }

        // ============================================================================
        // 6. PANTALLA DE LOGIN PRIVADA (SIN DESPLEGABLES NI CARGOS VISIBLES)
        // ============================================================================
        function LoginScreen({ users, delegationMap, loadingProgress, isFetchingUsers, syncMessage, onLoginSuccess, onRetrySync }) {
            const [usernameInput, setUsernameInput] = React.useState(() => localStorage.getItem('crediban_saved_login_user') || '');
            const [passwordInput, setPasswordInput] = React.useState(() => localStorage.getItem('crediban_saved_login_pass') || '');
            const [showPass, setShowPass] = React.useState(false);
            const [rememberCreds, setRememberCreds] = React.useState(true);
            const [error, setError] = React.useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');

                const cleanInputUser = normalizeUserKey(usernameInput);
                const cleanInputPass = String(passwordInput || '').trim();

                if (!cleanInputUser || !cleanInputPass) {
                    setError('⚠️ Por favor ingresa tu Usuario y Contraseña.');
                    return;
                }

                const matchedUser = users.find(u =>
                    normalizeUserKey(u.usuario) === cleanInputUser &&
                    String(u.clave).trim() === cleanInputPass
                );

                if (!matchedUser) {
                    const userExists = users.find(u => normalizeUserKey(u.usuario) === cleanInputUser);
                    if (userExists) {
                        const perm = evaluateUserUploadPermission(userExists, delegationMap);
                        if (!perm.allowed) {
                            setError('⛔ ACCESO RESTRINGIDO: Tu usuario no se encuentra habilitado por Gerencia para este módulo.');
                            return;
                        }
                    }
                    setError('🔒 Usuario o contraseña incorrectos. Verifica tus datos.');
                    return;
                }

                const permission = evaluateUserUploadPermission(matchedUser, delegationMap);
                if (!permission.allowed) {
                    setError(`⛔ ACCESO NO HABILITADO: Hola ${matchedUser.usuario}, actualmente solo Gerencia y el personal delegado tienen acceso habilitado.`);
                    return;
                }

                if (rememberCreds) {
                    localStorage.setItem('crediban_saved_login_user', usernameInput.trim());
                    localStorage.setItem('crediban_saved_login_pass', cleanInputPass);
                } else {
                    localStorage.removeItem('crediban_saved_login_user');
                    localStorage.removeItem('crediban_saved_login_pass');
                }

                onLoginSuccess({
                    ...matchedUser,
                    isManager: permission.isManager,
                    rolDelegado: permission.roleLabel
                }, rememberCreds);
            };

            return (
                <div className="min-h-screen login-bg flex flex-col justify-center items-center p-5">
                    <div className="mb-5 animate-fade-in">
                        <OfficialLogo darkBg={true} />
                    </div>

                    <div className="bg-white/10 backdrop-blur-xl w-full max-w-md rounded-3xl shadow-2xl p-7 border border-white/20 border-t-8 border-t-[#59B447] animate-fade-in">
                        <div className="text-center mb-5">
                            <div className="inline-flex items-center gap-1.5 bg-[#59B447]/20 border border-[#59B447]/50 text-emerald-300 text-[11px] font-extrabold px-3.5 py-1 rounded-full uppercase tracking-wider mb-2">
                                🔒 Portal Corporativo Autorizado
                            </div>
                            <h2 className="text-xl font-black text-white tracking-wide uppercase">Acceso al Sistema</h2>
                            <p className="text-xs text-slate-300 font-medium mt-0.5">Gerencia y Personal Autorizado • CREDIBAN PERÚ</p>
                        </div>

                        <div className="mb-5 bg-slate-900/60 p-2.5 rounded-2xl border border-slate-700/60">
                            <div className="flex justify-between items-center text-[11px] font-extrabold mb-1">
                                <span className="text-slate-300">
                                    {isFetchingUsers ? '🔄 Sincronizando con Servidor...' : `✅ ${syncMessage}`}
                                </span>
                                <div className="flex items-center gap-2">
                                    <span className="text-[#59B447]">{loadingProgress}%</span>
                                    <button type="button" onClick={onRetrySync} className="text-[10px] text-emerald-300 hover:underline" title="Recargar conexión al Servidor">↻</button>
                                </div>
                            </div>
                            <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div
                                    className="h-full bg-gradient-to-r from-[#59B447] to-emerald-400 transition-all duration-300"
                                    style={{ width: `${loadingProgress}%` }}
                                />
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-[11px] font-extrabold text-slate-300 uppercase block mb-1.5 ml-1">
                                    Usuario
                                </label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">👤</span>
                                    <input
                                        type="text"
                                        autoComplete="username"
                                        placeholder="Ingresa tu usuario"
                                        value={usernameInput}
                                        onChange={e => { setUsernameInput(e.target.value); setError(''); }}
                                        className="w-full bg-slate-900/80 border-2 border-slate-600/80 focus:border-[#59B447] text-white rounded-xl pl-10 pr-4 py-3 text-sm font-bold outline-none focus:ring-2 focus:ring-[#59B447]/30 transition-all"
                                        required
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="text-[11px] font-extrabold text-slate-300 uppercase block mb-1.5 ml-1">
                                    Contraseña
                                </label>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">🔑</span>
                                    <input
                                        type={showPass ? "text" : "password"}
                                        autoComplete="current-password"
                                        placeholder="••••••••••••"
                                        value={passwordInput}
                                        onChange={e => { setPasswordInput(e.target.value); setError(''); }}
                                        className="w-full bg-slate-900/80 border-2 border-[#59B447]/60 focus:border-[#59B447] text-white rounded-xl pl-10 pr-12 py-3 text-sm font-mono tracking-widest outline-none focus:ring-2 focus:ring-[#59B447]/40 transition-all"
                                        required
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowPass(!showPass)}
                                        className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs font-bold text-slate-400 hover:text-white"
                                    >
                                        {showPass ? '🙈' : '👁️'}
                                    </button>
                                </div>
                            </div>

                            {error && (
                                <div className="bg-red-500/20 text-red-200 text-xs font-bold p-3.5 rounded-xl border border-red-400/40 text-center leading-relaxed">
                                    {error}
                                </div>
                            )}

                            <label className="flex items-center gap-2.5 cursor-pointer pt-1 ml-1">
                                <input
                                    type="checkbox"
                                    checked={rememberCreds}
                                    onChange={e => setRememberCreds(e.target.checked)}
                                    className="w-4 h-4 accent-[#59B447] rounded"
                                />
                                <span className="text-xs font-semibold text-slate-300">
                                    🔒 Recordar contraseña y mantener sesión iniciada
                                </span>
                            </label>

                            <button
                                type="submit"
                                className="w-full bg-gradient-to-r from-[#59B447] to-[#4a973a] hover:opacity-95 active:scale-[0.99] text-white font-black py-3.5 rounded-2xl shadow-lg shadow-green-950/60 transition-all text-sm uppercase tracking-wider mt-2"
                            >
                                🔓 Ingresar al Sistema
                            </button>
                        </form>
                    </div>
                </div>
            );
        }// ============================================================================

                const cleanName = String(formNombre || '').trim().toUpperCase();

                    if (app.eliminado || String(app.id) === CLOUD_CONFIG_ID) return;
                    const appDni = String(app.dni || '').trim();
                    const appCel = String(app.celular || '').replace(/\D/g, '').trim();
                    const appName = String(app.nombre || '').trim().toUpperCase();

                    if (cleanDni.length >= 7 && appDni === cleanDni) {
                        warnings.push({ tipo: "DNI DUPLICADO", valor: cleanDni, candidato: app });
                    }
                    if (cleanCel.length >= 9 && appCel === cleanCel) {
                        warnings.push({ tipo: "CELULAR DUPLICADO", valor: cleanCel, candidato: app });

                    if (cleanName.length >= 7 && appName === cleanName) {

                setIsFolderBusy(true);
                try {
                    const res = await fetch(dataServerUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'createFolder', nombre: cleanName })
                    });
                    const data = await res.json();
                    if (data.status === 'ok' && Array.isArray(data.carpetas)) {
                        setFolders(data.carpetas);
                    } else {
                        setFolders(prev => [...prev, { id: "local-" + Date.now(), nombre: cleanName, url: CREDIBAN_VAULT.getMasterDriveUrl() }]);
                    }
                    setNewFolderName('');
                    return cleanName;
                } catch (e) {
                    setFolders(prev => [...prev, { id: "local-" + Date.now(), nombre: cleanName, url: CREDIBAN_VAULT.getMasterDriveUrl() }]);
                    setNewFolderName('');

                                        <option value="TODOS">💼 Cargo: Todos</option>

                                </div>

                                                <span className="font-bold">Hasta:</span>

                                                    type="date"

                                        <div className="text-sm font-black text-slate-800">

                                ) : filteredContractsList.map(person => {

                                    const c = ficha.contrato || {};

                                    const dayBeforeStr = c.fechaFin ? formatDateDisplay(addDaysToDateString(c.fechaFin, -1)) : '-';
                                    const asigFamMonto = Number(c.montoAsignacionFamiliar !== undefined ? c.montoAsignacionFamiliar : (ficha.montoAsignacionFamiliar || 0));

                                                    <h3 className="text-base md:text-lg font-black text-slate-900">

                                                        </div>

                                                                S/ {totalMensual.toFixed(2)} <span className="text-[10px] text-slate-500">(Básico: S/{c.sueldo || 0})</span>

                                                                                📄 Ver Doc
                                                                            </a>
                                                                        )}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Botonera Derecha */}
                                                <div className="flex flex-wrap lg:flex-col items-stretch justify-end gap-2 min-w-[260px]">
                                                    <button
                                                        onClick={() => openContractModalForPerson(person, 'RENOVAR_BASE')}
                                                        className="bg-[#59B447] hover:bg-[#4a9c3a] text-white font-black py-2.5 px-4 rounded-xl text-xs shadow-md flex items-center justify-center gap-1.5"

                                                            onClick={() => openContractModalForPerson(person, 'EDITAR')}

                                                        >
                                                            ✏️ Editar / Subir Doc

                                                            onClick={() => generateContractWordDocument({
                                                                nombre: person.nombre,
                                                                dni: person.dni,
                                                                celular: person.celular,

                                                                puesto: person.puesto,
                                                                sede: person.sede,
                                                                tipoContrato: c.tipoContrato,
                                                                sueldo: c.sueldo,
                                                                movilidadMonto: c.movilidadMonto,
                                                                asignacionFamiliar: c.asignacionFamiliar || ficha.asignacionFamiliar,
                                                                montoAsignacionFamiliar: asigFamMonto,
                                                                regimenPensionario: c.regimenPensionario || ficha.regimenPensionario,

                                                        >

                                                        </a>
                                                    ) : (
                                                        <button
                                                            onClick={() => openContractModalForPerson(person, 'EDITAR')}
                                                            className="bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 font-extrabold py-2 px-3 rounded-xl text-xs"
                                                        >
                                                            📤 Subir Contrato Escaneado / Word
                                                        </button>
                                                    )}

                                                            onClick={() => setDetailApplicant(person)}

                                                        >
                                                            📋 Ver Legajo Completo
                                                        </button>
                                                        {currentUser.isManager && (
                                                            <button
                                                                onClick={() => handleDeleteRecord(person)}
                                                                className="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 font-bold py-1.5 px-2.5 rounded-xl text-[11px]"
                                                                title="Eliminar registro"

                                                                🗑️
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                    )}

                    {/* ========================================================================
                        MODAL DE DELEGACIÓN DE SUBIDA (EXCLUSIVO PARA GERENTES)
                    ======================================================================== */}
                    {isDelegationModalOpen && currentUser.isManager && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-4 border-t-8 border-amber-400 shadow-2xl max-h-[95vh] flex flex-col">
                                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                                    <div>
                                        <h3 className="text-base font-black text-slate-900 flex items-center gap-2">
                                            <span>🛡️ Delegar Quién Puede Subir Archivos (Coordinado con Nómina)</span>
                                        </h3>
                                        <p className="text-xs font-semibold text-slate-500 mt-0.5">
                                            Por defecto los <b>Cajeros</b> están habilitados y ven únicamente los registros de su propia agencia. Aquí puedes designar al <b>Titular de Subida</b> o a un <b>2do Encargado (Apoyo)</b>.
                                        </p>
                                    </div>
                                    <button onClick={() => setIsDelegationModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-black text-sm">✕</button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">Filtrar por Agencia / Sede</label>

                                            value={delegationFilterSede}
                                            onChange={e => setDelegationFilterSede(e.target.value)}
                                            className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-black bg-white"
                                        >
                                            <option value="TODAS">🏢 Todas las Agencias ({nonManagerUsers.length} usuarios)</option>
                                            {agencias.map(ag => <option key={ag} value={ag}>Agencia {ag}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-500 uppercase block mb-1">Buscar Nombre o Cargo en Nómina</label>
                                        <input
                                            type="text"
                                            value={delegationSearch}
                                            onChange={e => setDelegationSearch(e.target.value)}
                                            placeholder="🔍 Ej: Luis Gomez, Cajero..."
                                            className="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold bg-white outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="space-y-2 overflow-y-auto flex-1 pr-1 max-h-96">
                                    {nonManagerUsers
                                        .filter(u => {
                                            const matchSede = delegationFilterSede === 'TODAS' || u.sede === delegationFilterSede;
                                            const q = delegationSearch.toLowerCase().trim();
                                            const matchQ = !q || u.usuario.toLowerCase().includes(q) || u.cargo.toLowerCase().includes(q) || u.sede.toLowerCase().includes(q);
                                            return matchSede && matchQ;
                                        })
                                        .map(u => {
                                            const perm = evaluateUserUploadPermission(u, delegationMap);
                                            return (
                                                <div

                                                        value={detailApplicant.sede}
                                                        onChange={e => setDetailApplicant({ ...detailApplicant, sede: e.target.value })}
                                                        disabled={!currentUser.isManager}
                                                        className="border border-slate-300 rounded-xl px-2.5 py-2 text-xs font-bold bg-slate-50 disabled:opacity-75"
                                                    >
                                                        {agencias.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                    <select
                                                        value={detailApplicant.carpetaNombre || 'General'}
                                                        onChange={e => setDetailApplicant({ ...detailApplicant, carpetaNombre: e.target.value })}
                                                        className="border border-blue-300 rounded-xl px-2.5 py-2 text-xs font-bold bg-blue-50 text-blue-900"
                                                    >
                                                        {folders.map(f => <option key={f.id || f.nombre} value={f.nombre}>📁 {f.nombre}</option>)}
                                                    </select>
                                                </div>

                                                <textarea
                                                    rows="2"
                                                    value={newCommentText}
                                                    onChange={e => setNewCommentText(e.target.value)}
                                                    placeholder={detailApplicant.comentarioActual || "Añadir observación o dictamen de entrevista..."}
                                                    className="w-full border border-slate-300 rounded-xl p-2.5 text-xs font-semibold outline-none focus:ring-2 focus:ring-[#59B447]"
                                                />

                                                <button
                                                    type="button"
                                                    disabled={isSaving}
                                                    onClick={() => handleUpdateApplicantQuick(detailApplicant, newCommentText.trim())}
                                                    className="w-full bg-[#59B447] hover:bg-[#4a9c3a] text-white font-black py-3 rounded-2xl text-xs uppercase tracking-wider shadow-lg disabled:opacity-50"
                                                >
                                                    {isSaving ? '⏳ Guardando Cambios...' : `💾 Guardar Ficha, Beneficios y Biografía IA (${currentUser.usuario})`}
                                                </button>
                                            </div>
                                        </div>

                                        {/* COLUMNA DERECHA (5 cols): VISOR DEL DOCUMENTO */}
                                        <div className="lg:col-span-5 flex flex-col justify-between space-y-4">
                                            <div className="bg-slate-100 rounded-2xl p-3 border border-slate-200 flex-1 flex flex-col min-h-[320px]">
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs font-black text-slate-700 uppercase">📄 Documento CV / Contrato</span>
                                                    <div className="flex gap-1.5">
                                                        {detailApplicant.urlCvPreview && (
                                                            <a
                                                                href={detailApplicant.urlCvDownload || detailApplicant.urlCvPreview}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                download={ficha.nombreArchivoOriginal || `CV_${detailApplicant.nombre}`}
                                                                className="bg-slate-800 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg"
                                                            >
                                                                📥 Descargar CV
                                                            </a>
                                                        )}
                                                        {contrato.urlContratoPreview && (
                                                            <a
                                                                href={contrato.urlContratoDownload || contrato.urlContratoPreview}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                download={contrato.nombreArchivoContrato || `Contrato_${detailApplicant.nombre}`}
                                                                className="bg-indigo-700 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg"
                                                            >
                                                                📜 Descargar Contrato
                                                            </a>
                                                        )}
                                                    </div>
                                                </div>

                                                {activeDocUrl ? (
                                                    isWordBase64 ? (
                                                        <div className="flex-1 flex flex-col items-center justify-center text-center p-6 bg-white rounded-xl border border-slate-200 space-y-3">
                                                            <div className="text-4xl">📝</div>
                                                            <div className="text-xs font-black text-slate-800">Documento Microsoft Word Adjuntado</div>
                                                            <a
                                                                href={detailApplicant.urlCvDownload || contrato.urlContratoDownload || activeDocUrl}
                                                                download={ficha.nombreArchivoOriginal || contrato.nombreArchivoContrato || `Documento_${detailApplicant.nombre}.docx`}
                                                                className="bg-blue-600 text-white font-black px-4 py-2 rounded-xl text-xs shadow"
                                                            >
                                                                📥 Descargar Archivo Word
                                                            </a>
                                                        </div>
                                                    ) : (
                                                        <iframe
                                                            src={activeDocUrl}
                                                            className="w-full flex-1 min-h-[260px] rounded-xl border bg-white"
                                                            title="Visor Documento"
                                                        />
                                                    )
                                                ) : (
                                                    <div className="flex-1 flex flex-col items-center justify-center text-center p-6 text-slate-400">
                                                        <div className="text-4xl mb-2">📄</div>
                                                        <div className="text-xs font-bold">Sin archivo PDF o Word vinculado.</div>
                                                    </div>
                                                )}

                                                <div className="mt-2 pt-2 border-t border-slate-200">
                                                    <label className="text-[11px] font-bold text-slate-600 block mb-1">🔄 Actualizar CV (PDF o Word .docx):</label>
                                                    <input
                                                        type="file"
                                                        accept=".pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*"
                                                        onChange={e => setReplaceCvFile(e.target.files[0] || null)}
                                                        className="w-full text-xs bg-white p-1.5 rounded-lg border border-slate-300"
                                                    />
                                                </div>
                                            </div>

                                            <div className="bg-slate-50 rounded-2xl p-3.5 border border-slate-200">
                                                <div className="text-[11px] font-black text-slate-600 uppercase mb-2">
                                                    🕒 Bitácora de Evaluaciones y Subidas ({detailApplicant.historial?.length || 0})
                                                </div>
                                                <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                                                    {Array.isArray(detailApplicant.historial) && detailApplicant.historial.length > 0 ? (
                                                        detailApplicant.historial.map((h, i) => (
                                                            <div key={i} className="bg-white border border-slate-200 rounded-xl p-2.5 text-xs">
                                                                <div className="flex justify-between font-bold text-[10px] text-slate-700">
                                                                    <span>👔 {h.gerente} ({h.sede})</span>
                                                                    <span>{h.estado} • ⭐ {h.nota} • {h.fecha}</span>
                                                                </div>
                                                                <div className="text-slate-600 mt-1 italic">"{h.comentario}"</div>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        <div className="text-xs text-slate-400 italic">Sin registros previos.</div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ========================================================================
                        MODAL 4: GESTOR GLOBAL DE AGENCIAS (EXCLUSIVO PARA GERENTES)
                    ======================================================================== */}
                    {isAgencyModalOpen && currentUser.isManager && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 border-t-8 border-[#59B447] shadow-2xl">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h3 className="text-base font-black text-slate-800">🏢 Gestor Global de Agencias CREDIBAN</h3>
                                        <p className="text-[11px] text-slate-500 font-semibold">
                                            ☁️ Cualquier agencia añadida o editada aquí se sincroniza en el Servidor para todos los dispositivos.
                                        </p>
                                    </div>
                                    <button onClick={() => setIsAgencyModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-black text-sm">✕</button>
                                </div>

                                <div className="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-3.5 space-y-2">
                                    <label className="text-xs font-extrabold text-emerald-950 block">➕ Añadir Nueva Agencia / Sede</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={newAgencyName}
                                            onChange={e => setNewAgencyName(e.target.value.toUpperCase())}
                                            placeholder="Ej: HUANUCO, BARRANCA, CHIMBOTE..."
                                            className="flex-1 border border-emerald-300 rounded-xl px-3 py-2 text-xs font-black uppercase bg-white outline-none"
                                        />
                                        <button
                                            type="button"
                                            disabled={isSyncingConfig || !newAgencyName.trim()}
                                            onClick={handleAddAgency}
                                            className="bg-[#59B447] hover:bg-[#4a9c3a] text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow disabled:opacity-50"
                                        >
                                            {isSyncingConfig ? 'Sincronizando...' : 'Añadir Agencia'}
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                                    {agencias.map(ag => {
                                        const isEditing = editingAgencyOld === ag;
                                        const count = applicants.filter(a => !a.eliminado && a.sede === ag).length;
                                        return (
                                            <div key={ag} className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-2xl p-2.5">
                                                {isEditing ? (
                                                    <div className="flex-1 flex items-center gap-2">
                                                        <input
                                                            type="text"
                                                            value={editingAgencyNew}
                                                            onChange={e => setEditingAgencyNew(e.target.value.toUpperCase())}
                                                            className="flex-1 border border-emerald-500 rounded-xl px-2.5 py-1.5 text-xs font-black uppercase bg-white"
                                                            autoFocus
                                                        />
                                                        <button
                                                            type="button"
                                                            disabled={isSyncingConfig}
                                                            onClick={() => handleRenameAgency(ag)}
                                                            className="bg-emerald-600 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs"
                                                        >
                                                            💾 Guardar en Nube
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setEditingAgencyOld(null)}
                                                            className="text-xs font-bold text-slate-400 px-2"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <div>
                                                            <div className="text-xs font-black text-slate-800">🏢 Agencia {ag}</div>
                                                            <div className="text-[10px] font-bold text-slate-400">{count} registros vinculados</div>
                                                        </div>
                                                        <div className="flex items-center gap-1.5">
                                                            <button
                                                                type="button"
                                                                onClick={() => { setEditingAgencyOld(ag); setEditingAgencyNew(ag); }}
                                                                className="bg-white border border-slate-200 text-slate-700 font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                ✏️ Editar Nombre
                                                            </button>
                                                            <button
                                                                type="button"
                                                                onClick={() => handleDeleteAgency(ag)}
                                                                className="bg-red-50 border border-red-200 text-red-700 font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================================
                        MODAL 5: GESTOR DE CARPETAS DE ALMACENAMIENTO (EXCLUSIVO PARA GERENTES)
                    ======================================================================== */}
                    {isFolderModalOpen && currentUser.isManager && (
                        <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 border-t-8 border-blue-600 shadow-2xl">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h3 className="text-base font-black text-slate-800">📁 Gestor de Carpetas del Servidor (Solo Gerencia)</h3>
                                        <p className="text-[11px] text-slate-500 font-semibold">
                                            Carpeta Maestra: <a href={CREDIBAN_VAULT.getMasterDriveUrl()} target="_blank" rel="noopener noreferrer" className="text-blue-600 underline font-bold">Abrir Carpeta Raíz ↗</a>
                                        </p>
                                    </div>
                                    <button onClick={() => setIsFolderModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-black text-sm">✕</button>
                                </div>

                                <div className="bg-blue-50/70 border border-blue-200 rounded-2xl p-3.5 space-y-2">
                                    <label className="text-xs font-extrabold text-blue-950 block">➕ Crear Nueva Subcarpeta</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={newFolderName}
                                            onChange={e => setNewFolderName(e.target.value)}
                                            placeholder="Ej: Contratos Huánuco 2026..."
                                            className="flex-1 border border-blue-300 rounded-xl px-3 py-2 text-xs font-bold bg-white outline-none"
                                        />
                                        <button
                                            type="button"
                                            disabled={isFolderBusy || !newFolderName.trim()}
                                            onClick={() => handleCreateFolder(newFolderName)}
                                            className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow disabled:opacity-50"
                                        >
                                            {isFolderBusy ? 'Creando...' : 'Crear Carpeta'}
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                                    {folders.map(f => {
                                        const isEditing = editingFolderKey === f.nombre;
                                        const count = scopedApplicants.filter(a => (a.carpetaNombre || 'General') === f.nombre).length;
                                        return (
                                            <div key={f.id || f.nombre} className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-2xl p-2.5">
                                                {isEditing ? (
                                                    <div className="flex-1 flex items-center gap-2">
                                                        <input
                                                            type="text"
                                                            value={editingFolderValue}
                                                            onChange={e => setEditingFolderValue(e.target.value)}
                                                            className="flex-1 border border-blue-400 rounded-xl px-2.5 py-1.5 text-xs font-bold bg-white"
                                                            autoFocus
                                                        />
                                                        <button
                                                            type="button"
                                                            disabled={isFolderBusy}
                                                            onClick={() => handleRenameFolder(f)}
                                                            className="bg-emerald-600 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs"
                                                        >
                                                            💾 Guardar
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => setEditingFolderKey(null)}
                                                            className="text-xs font-bold text-slate-400 px-2"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <div>
                                                            <div className="text-xs font-black text-slate-800">📁 {f.nombre}</div>
                                                            <div className="text-[10px] font-bold text-slate-400">{count} registros</div>
                                                        </div>
                                                        <div className="flex items-center gap-1.5">
                                                            <button
                                                                type="button"
                                                                onClick={() => { setEditingFolderKey(f.nombre); setEditingFolderValue(f.nombre); }}
                                                                className="bg-white border border-slate-200 text-slate-700 font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                ✏️ Editar Nombre
                                                            </button>
                                                            <a
                                                                href={f.url || CREDIBAN_VAULT.getMasterDriveUrl()}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                className="bg-slate-800 text-white font-bold px-2.5 py-1.5 rounded-xl text-xs"
                                                            >
                                                                ↗ Abrir
                                                            </a>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
